[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guerilla-analytics"
version = "0.1.0"
description = "Offline football video analysis for grassroots teams"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
include-package-data = false
py-modules = ["lap"]

[tool.setuptools.dynamic]
dependencies = { file = ["backend/requirements-runtime.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["backend.storage*", "backend.tests*"]
namespaces = true

[tool.setuptools.package-data]
backend = [
  "release/*.json",
  "release/verification/*.json",
]

[tool.setuptools.exclude-package-data]
backend = [
  "storage/*",
  "storage/**/*",
]

[tool.pytest.ini_options]
markers = [
  "integration: exercises multiple processes or external process boundaries",
]
