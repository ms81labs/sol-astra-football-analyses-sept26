[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guerilla-analytics"
version = "0.1.0"
description = "Offline football video analysis for grassroots teams"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
api = [
  "boto3==1.34.131",
  "daytona==0.207.0",
  "fastapi==0.121.0",
  "fastparquet==2025.12.0",
  "httpx==0.28.1",
  "pandas==3.0.1",
  "pydantic==2.13.5",
  "python-multipart==0.0.32",
  "requests==2.32.5",
  "starlette==0.49.3",
  "uvicorn==0.38.0",
]
cv = [
  "filterpy==1.4.5",
  "matplotlib==3.10.8",
  "numpy==2.4.2",
  "opencv-python==4.13.0.92",
  "pillow==12.1.1",
  "polars==1.38.1",
  "pyyaml==6.0.3",
  "scipy==1.17.0",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "ultralytics==8.4.14",
  "ultralytics-thop==2.0.18",
]
cuda = [
  "cuda-bindings==12.9.4; sys_platform == 'linux'",
  "cuda-pathfinder==1.3.4; sys_platform == 'linux'",
  "nvidia-cublas-cu12==12.8.4.1; sys_platform == 'linux'",
  "nvidia-cuda-cupti-cu12==12.8.90; sys_platform == 'linux'",
  "nvidia-cuda-nvrtc-cu12==12.8.93; sys_platform == 'linux'",
  "nvidia-cuda-runtime-cu12==12.8.90; sys_platform == 'linux'",
  "nvidia-cudnn-cu12==9.10.2.21; sys_platform == 'linux'",
  "nvidia-cufft-cu12==11.3.3.83; sys_platform == 'linux'",
  "nvidia-cufile-cu12==1.13.1.3; sys_platform == 'linux'",
  "nvidia-curand-cu12==10.3.9.90; sys_platform == 'linux'",
  "nvidia-cusolver-cu12==11.7.3.90; sys_platform == 'linux'",
  "nvidia-cusparse-cu12==12.5.8.93; sys_platform == 'linux'",
  "nvidia-cusparselt-cu12==0.7.1; sys_platform == 'linux'",
  "nvidia-nccl-cu12==2.27.5; sys_platform == 'linux'",
  "nvidia-nvjitlink-cu12==12.8.93; sys_platform == 'linux'",
  "nvidia-nvshmem-cu12==3.4.5; sys_platform == 'linux'",
  "nvidia-nvtx-cu12==12.8.90; sys_platform == 'linux'",
  "triton==3.6.0; sys_platform == 'linux'",
]

[tool.setuptools]
include-package-data = false
py-modules = ["lap"]

[tool.setuptools.dynamic]
dependencies = { file = ["backend/requirements/api.in"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["backend.storage*", "backend.tests*"]
namespaces = true

[tool.setuptools.package-data]
backend = [
  "release/*.json",
  "release/verification/*.json",
]

[tool.setuptools.exclude-package-data]
backend = [
  "storage/*",
  "storage/**/*",
]

[tool.pytest.ini_options]
markers = [
  "gpu: requires a CUDA-capable runtime and must never be silently skipped in GPU acceptance",
  "integration: exercises multiple processes or external process boundaries",
  "real_media: requires local ffmpeg and ffprobe executables",
]
