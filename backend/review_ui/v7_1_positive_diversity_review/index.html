<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V7.1 Positive Diversity Review</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d1117;
        color: #f0f3f6;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #0d1117; }
      button, select, textarea, input { font: inherit; }
      .app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 100vh; }
      .stage { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; border-right: 1px solid #30363d; }
      .toolbar, .footer { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #161b22; border-bottom: 1px solid #30363d; }
      .footer { border-top: 1px solid #30363d; border-bottom: 0; }
      button, .decision-button, select { border: 1px solid #3b434d; border-radius: 6px; background: #21262d; color: #f0f3f6; min-height: 34px; padding: 6px 10px; }
      button { cursor: pointer; }
      button:hover, .decision-button:hover { border-color: #58a6ff; }
      .primary { border-color: #238636; background: #1f6f3d; }
      .warning { border-color: #8b6f1f; background: #6e5315; }
      .danger { border-color: #da3633; background: #842029; }
      .canvas-wrap { min-height: 0; overflow: auto; display: grid; grid-template-rows: minmax(0, 1fr) minmax(180px, 34vh); background: #05080d; }
      .image-pane { min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; border-bottom: 1px solid #30363d; }
      canvas, #crop-image { display: block; max-width: 100%; max-height: 100%; background: #111827; }
      canvas { cursor: crosshair; }
      aside { min-width: 0; padding: 14px; background: #0d1117; overflow: auto; }
      h1, h2 { margin: 0 0 10px; font-size: 16px; line-height: 1.25; }
      h2 { margin-top: 18px; font-size: 13px; color: #8b949e; text-transform: uppercase; }
      .progress { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
      .stat { border: 1px solid #30363d; border-radius: 6px; padding: 8px; background: #161b22; }
      .stat strong { display: block; font-size: 18px; }
      .stat span { color: #8b949e; font-size: 12px; }
      .decisions { display: grid; gap: 8px; }
      .reason-grid { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 8px; }
      .reason-chip { text-align: left; min-height: 30px; padding: 5px 8px; color: #c9d1d9; }
      textarea, input { width: 100%; border: 1px solid #30363d; border-radius: 6px; background: #010409; color: #f0f3f6; padding: 8px; }
      textarea { min-height: 72px; resize: vertical; }
      .meta-grid { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; }
      .meta-grid dt { color: #8b949e; }
      .meta-grid dd { margin: 0; overflow-wrap: anywhere; }
      .status { min-height: 20px; color: #8b949e; font-size: 13px; }
      @media (max-width: 980px) { .app { grid-template-columns: 1fr; } .stage { border-right: 0; } }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="stage">
        <div class="toolbar">
          <button id="previous">Prev</button>
          <button id="next">Next</button>
          <select id="filter">
            <option value="pending_review">Pending</option>
            <option value="all">All</option>
            <option value="reviewed_positive_ball">Positive</option>
            <option value="reviewed_not_ball">Not ball</option>
            <option value="review_deferred_unclear">Unclear</option>
            <option value="duplicate_or_near_duplicate">Duplicate</option>
          </select>
          <span class="status" id="position"></span>
        </div>
        <div class="canvas-wrap">
          <div class="image-pane"><canvas id="review-canvas" width="1280" height="720"></canvas></div>
          <div class="image-pane"><img id="crop-image" alt="" /></div>
        </div>
        <div class="footer">
          <button id="reset-box">Reset box</button>
          <button id="run-resolution">Run --v2 resolver</button>
          <span class="status" id="status"></span>
        </div>
      </section>
      <aside>
        <h1>V7.1 Positive Diversity Review</h1>
        <div class="progress">
          <div class="stat"><strong id="pending-count">0</strong><span>pending</span></div>
          <div class="stat"><strong id="resolved-count">0</strong><span>resolved</span></div>
          <div class="stat"><strong id="positive-count">0</strong><span>positives</span></div>
          <div class="stat"><strong id="unclear-count">0</strong><span>unclear</span></div>
        </div>
        <h2>Decision</h2>
        <div class="decisions">
          <button class="decision-button primary" data-status="reviewed_positive_ball">A Positive corrected</button>
          <button class="decision-button danger" data-status="reviewed_not_ball" data-default-reason="replacement_ball_not_in_play">R Not ball</button>
          <button class="decision-button warning" data-status="review_deferred_unclear" data-default-reason="ball_not_visible_enough_to_box_confidently">U Unclear</button>
          <button class="decision-button warning" data-status="duplicate_or_near_duplicate" data-default-reason="near_duplicate_of_existing_or_accepted_positive">D Duplicate</button>
          <button class="decision-button danger" data-status="bad_crop_or_unusable_frame" data-default-reason="bad_crop_or_unusable_frame">X Bad crop</button>
          <button class="decision-button" data-status="pending_review">S Save notes only</button>
        </div>
        <h2>Reason / Notes</h2>
        <div class="reason-grid">
          <button class="reason-chip" data-reason="replacement_ball_not_in_play">replacement ball, not in play</button>
          <button class="reason-chip" data-reason="player_foot_or_sock">player foot / sock / boot</button>
          <button class="reason-chip" data-reason="field_marking_or_line_artifact">field marking / line artifact</button>
          <button class="reason-chip" data-reason="ball_not_visible_enough_to_box_confidently">unclear: cannot box confidently</button>
          <button class="reason-chip" data-reason="near_duplicate_of_existing_or_accepted_positive">duplicate / near duplicate</button>
        </div>
        <input id="rejection-reason" placeholder="Reason for non-positive" />
        <textarea id="review-notes" placeholder="Optional review notes"></textarea>
        <label class="status"><input id="auto-advance" type="checkbox" checked /> auto-advance after save</label>
        <h2>Frame</h2>
        <dl class="meta-grid" id="meta"></dl>
      </aside>
    </main>
    <script>
      const canvas = document.getElementById("review-canvas");
      const ctx = canvas.getContext("2d");
      const cropImage = document.getElementById("crop-image");
      const statusEl = document.getElementById("status");
      const positionEl = document.getElementById("position");
      const filterEl = document.getElementById("filter");
      const reasonEl = document.getElementById("rejection-reason");
      const notesEl = document.getElementById("review-notes");
      const autoAdvanceEl = document.getElementById("auto-advance");
      const metaEl = document.getElementById("meta");
      let state = null, filteredItems = [], currentIndex = 0, image = new Image(), activeBox = null, dragMode = null, dragStart = null, pendingAction = false;
      const setStatus = (text) => { statusEl.textContent = text || ""; };
      function setPendingAction(pending) {
        pendingAction = pending;
        document.querySelector("main").setAttribute("aria-busy", pending ? "true" : "false");
        document.querySelectorAll("main button, main input, main select, main textarea").forEach((control) => { control.disabled = pending; });
      }
      const cloneBox = (box) => box ? { x1: box.x1, y1: box.y1, x2: box.x2, y2: box.y2 } : null;
      const boxWidth = (box) => Math.max(0, box.x2 - box.x1);
      const boxHeight = (box) => Math.max(0, box.y2 - box.y1);
      const currentItem = () => filteredItems[currentIndex] || null;
      function updateStats(summary) {
        document.getElementById("pending-count").textContent = summary.pendingReviewItemCount;
        document.getElementById("resolved-count").textContent = summary.resolvedReviewItemCount;
        document.getElementById("positive-count").textContent = summary.newReviewedPositiveRowCount;
        document.getElementById("unclear-count").textContent = summary.reviewDeferredUnclearCount;
      }
      function renderMeta(item) {
        const pairs = [["status", item.reviewStatus], ["candidateKind", item.candidateKind], ["frameIndex", item.frameIndex], ["sourceClipId", item.sourceClipId], ["candidateId", item.candidateId], ["bboxSource", item.bboxSource], ["splitGroupId", item.splitGroupId], ["pitchRegionClass", item.pitchRegionClass], ["playabilityClass", item.playabilityClass], ["replacementBallRisk", item.replacementBallRisk], ["sourceFrameBbox", JSON.stringify(item.sourceFrameBbox)]];
        metaEl.replaceChildren();
        pairs.forEach(([key, value]) => {
          const dt = document.createElement("dt");
          const dd = document.createElement("dd");
          dt.textContent = key;
          dd.textContent = String(value ?? "");
          metaEl.append(dt, dd);
        });
        reasonEl.value = item.rejectionReason || "";
        notesEl.value = item.reviewNotes || "";
      }
      function drawBox(box, color, label) {
        if (!box) return;
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.strokeRect(box.x1, box.y1, boxWidth(box), boxHeight(box));
        ctx.fillStyle = color;
        ctx.font = "16px sans-serif";
        ctx.fillText(label, box.x1, Math.max(16, box.y1 - 6));
        ctx.restore();
      }
      function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (image.complete && image.naturalWidth) ctx.drawImage(image, 0, 0);
        const item = currentItem();
        if (!item) return;
        drawBox(item.originalSourceFrameBbox || item.sourceFrameBbox, "#58a6ff", "proposed");
        drawBox(activeBox, "#f2cc60", "review");
      }
      function renderMissingFrame(message) {
        canvas.width = 1280;
        canvas.height = 720;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#111827";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f0f3f6";
        ctx.font = "28px sans-serif";
        ctx.fillText(message, 48, 96);
        ctx.font = "18px sans-serif";
        ctx.fillStyle = "#8b949e";
        ctx.fillText("Mark as bad crop/unusable if this item appears in review.", 48, 136);
      }
      function renderCurrent() {
        const item = currentItem();
        if (!item) { positionEl.textContent = "No items"; return; }
        positionEl.textContent = `${currentIndex + 1} / ${filteredItems.length}`;
        activeBox = cloneBox(item.sourceFrameBbox);
        renderMeta(item);
        cropImage.removeAttribute("src");
        if (item.cropImageUrl) cropImage.src = item.cropImageUrl;
        image = new Image();
        if (item.frameImageUrl) {
          image.onload = () => { canvas.width = image.naturalWidth; canvas.height = image.naturalHeight; redraw(); };
          image.onerror = () => { renderMissingFrame("Review frame image failed to load"); };
          image.src = item.frameImageUrl;
        } else {
          renderMissingFrame("No review frame image generated");
          setStatus("No review image for this mined candidate.");
        }
      }
      function applyFilter({ previousId = null, advance = false } = {}) {
        const filter = filterEl.value;
        filteredItems = state.reviewItems.filter((item) => filter === "all" || item.reviewStatus === filter);
        if (previousId && advance) {
          const previousIndex = filteredItems.findIndex((item) => item.candidateId === previousId);
          currentIndex = previousIndex >= 0 ? previousIndex + 1 : currentIndex;
        }
        currentIndex = Math.min(currentIndex, Math.max(0, filteredItems.length - 1));
        renderCurrent();
      }
      async function loadState(options = {}) {
        const response = await fetch("/api/review-state");
        if (!response.ok) throw new Error(`review-state failed: ${response.status}`);
        state = await response.json();
        updateStats(state.summary);
        applyFilter(options);
      }
      async function saveStatus(reviewStatus, defaultReason = "") {
        if (pendingAction) return;
        const item = currentItem();
        if (!item) return;
        if (defaultReason && !reasonEl.value && reviewStatus !== "reviewed_positive_ball") {
          reasonEl.value = defaultReason;
        }
        const body = { reviewStatus, reviewNotes: notesEl.value };
        if (reviewStatus === "reviewed_positive_ball") {
          body.sourceFrameBbox = activeBox;
          body.bboxSource = item.candidateKind === "off_bbox_visible_ball_correction_queue" ? "manual_corrected_from_off_bbox_candidate" : "manual_confirmed_candidate_bbox";
          body.originalCandidateBboxWasOffTarget = item.candidateKind === "off_bbox_visible_ball_correction_queue";
          body.visibilityClass = "clear";
          body.contextTags = ["small_ball"];
        } else if (reviewStatus !== "pending_review") {
          body.rejectionReason = reasonEl.value || "reviewed_not_positive";
        }
        const candidateId = item.candidateId;
        const advance = autoAdvanceEl.checked;
        setPendingAction(true);
        try {
          const response = await fetch(`/api/review-items/${encodeURIComponent(candidateId)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          const payload = await response.json();
          if (!response.ok) { setStatus(payload.error || "Save failed"); return; }
          await loadState({ previousId: candidateId, advance });
          setStatus(`Saved ${reviewStatus} for ${candidateId}`);
        } catch (_) {
          setStatus("Save failed");
        } finally {
          setPendingAction(false);
        }
      }
      function move(delta) { currentIndex = Math.max(0, Math.min(filteredItems.length - 1, currentIndex + delta)); renderCurrent(); }
      function canvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: (event.clientX - rect.left) * (canvas.width / rect.width), y: (event.clientY - rect.top) * (canvas.height / rect.height) };
      }
      canvas.addEventListener("mousedown", (event) => {
        if (pendingAction) return;
        const point = canvasPoint(event);
        activeBox = activeBox || { x1: point.x, y1: point.y, x2: point.x + 16, y2: point.y + 16 };
        dragStart = { point, box: cloneBox(activeBox) };
        const nearCorner = Math.abs(point.x - activeBox.x2) < 12 && Math.abs(point.y - activeBox.y2) < 12;
        dragMode = nearCorner ? "resize" : "move";
      });
      window.addEventListener("mousemove", (event) => {
        if (pendingAction) return;
        if (!dragMode || !dragStart || !activeBox) return;
        const point = canvasPoint(event), dx = point.x - dragStart.point.x, dy = point.y - dragStart.point.y;
        if (dragMode === "resize") { activeBox.x2 = Math.max(activeBox.x1 + 4, dragStart.box.x2 + dx); activeBox.y2 = Math.max(activeBox.y1 + 4, dragStart.box.y2 + dy); }
        else { const w = boxWidth(dragStart.box), h = boxHeight(dragStart.box); activeBox.x1 = Math.max(0, dragStart.box.x1 + dx); activeBox.y1 = Math.max(0, dragStart.box.y1 + dy); activeBox.x2 = activeBox.x1 + w; activeBox.y2 = activeBox.y1 + h; }
        redraw();
      });
      window.addEventListener("mouseup", () => { dragMode = null; dragStart = null; if (pendingAction) return; });
      document.getElementById("previous").addEventListener("click", () => { if (!pendingAction) move(-1); });
      document.getElementById("next").addEventListener("click", () => { if (!pendingAction) move(1); });
      document.getElementById("reset-box").addEventListener("click", () => { if (pendingAction) return; const item = currentItem(); activeBox = cloneBox(item && item.sourceFrameBbox); redraw(); });
      filterEl.addEventListener("change", () => { if (pendingAction) return; currentIndex = 0; applyFilter(); });
      document.querySelectorAll("[data-status]").forEach((button) => button.addEventListener("click", () => saveStatus(button.dataset.status, button.dataset.defaultReason || "")));
      document.querySelectorAll("[data-reason]").forEach((button) => {
        button.addEventListener("click", () => {
          if (pendingAction) return;
          reasonEl.value = button.dataset.reason;
          setStatus(`Reason set: ${button.dataset.reason}`);
        });
      });
      async function runResolution() {
        if (pendingAction) return;
        setPendingAction(true);
        try {
          const response = await fetch("/api/run-resolution", { method: "POST", body: "{}" });
          const payload = await response.json();
          setStatus(response.ok ? (payload.primaryBlocker ? `Gate: ${payload.primaryBlocker}` : `Gate: ${payload.nextRecommendedNextLever}`) : payload.error || "Resolver failed");
        } catch (_) {
          setStatus("Resolver failed");
        } finally {
          setPendingAction(false);
        }
      }
      document.getElementById("run-resolution").addEventListener("click", () => { runResolution(); });
      window.addEventListener("keydown", (event) => {
        if (pendingAction) return;
        if (event.target === notesEl || event.target === reasonEl) return;
        if (event.key === "ArrowLeft") move(-1);
        if (event.key === "ArrowRight") move(1);
        if (event.key.toLowerCase() === "a") saveStatus("reviewed_positive_ball");
        if (event.key.toLowerCase() === "r") saveStatus("reviewed_not_ball", reasonEl.value || "replacement_ball_not_in_play");
        if (event.key.toLowerCase() === "u") saveStatus("review_deferred_unclear", reasonEl.value || "ball_not_visible_enough_to_box_confidently");
        if (event.key.toLowerCase() === "d") saveStatus("duplicate_or_near_duplicate", reasonEl.value || "near_duplicate_of_existing_or_accepted_positive");
        if (event.key.toLowerCase() === "x") saveStatus("bad_crop_or_unusable_frame", reasonEl.value || "bad_crop_or_unusable_frame");
      });
      loadState().catch((error) => setStatus(error.message));
    </script>
  </body>
</html>
