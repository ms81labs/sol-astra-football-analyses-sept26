<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoccerNet Detector Miss Review</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0f14;
        color: #f0f3f6;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #0b0f14; }
      button, select, textarea, input { font: inherit; }
      .app { display: grid; grid-template-columns: minmax(0, 1fr) 390px; min-height: 100vh; }
      .stage { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; border-right: 1px solid #30363d; }
      .toolbar, .footer { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #161b22; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
      .footer { border-top: 1px solid #30363d; border-bottom: 0; }
      button, select { border: 1px solid #3b434d; border-radius: 6px; background: #21262d; color: #f0f3f6; min-height: 34px; padding: 6px 10px; }
      button { cursor: pointer; }
      button:hover { border-color: #58a6ff; }
      .primary { border-color: #238636; background: #1f6f3d; }
      .warning { border-color: #8b6f1f; background: #6e5315; }
      .danger { border-color: #da3633; background: #842029; }
      .canvas-wrap { min-height: 0; overflow: auto; display: grid; grid-template-rows: minmax(0, 1fr) minmax(160px, 34vh); background: #05080d; }
      .image-pane { min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; border-bottom: 1px solid #30363d; }
      canvas, #crop-image { display: block; max-width: 100%; max-height: 100%; background: #111827; }
      canvas { cursor: crosshair; }
      aside { min-width: 0; padding: 14px; background: #0b0f14; overflow: auto; }
      h1, h2 { margin: 0 0 10px; font-size: 16px; line-height: 1.25; }
      h2 { margin-top: 18px; font-size: 13px; color: #8b949e; text-transform: uppercase; }
      .progress { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
      .stat { border: 1px solid #30363d; border-radius: 6px; padding: 8px; background: #161b22; }
      .stat strong { display: block; font-size: 18px; }
      .stat span { color: #8b949e; font-size: 12px; }
      .decisions, .reason-grid { display: grid; gap: 8px; }
      .reason-chip { text-align: left; min-height: 30px; padding: 5px 8px; color: #c9d1d9; }
      textarea, input { width: 100%; border: 1px solid #30363d; border-radius: 6px; background: #010409; color: #f0f3f6; padding: 8px; }
      textarea { min-height: 76px; resize: vertical; }
      .meta-grid { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; }
      .meta-grid dt { color: #8b949e; }
      .meta-grid dd { margin: 0; overflow-wrap: anywhere; }
      .status { min-height: 20px; color: #8b949e; font-size: 13px; }
      .hint { color: #c9d1d9; font-size: 13px; line-height: 1.45; margin: 0 0 10px; }
      @media (max-width: 980px) { .app { grid-template-columns: 1fr; } .stage { border-right: 0; } }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="stage">
        <div class="toolbar">
          <button id="previous">Prev</button>
          <button id="next">Next</button>
          <select id="filter">
            <option value="pending_review">Pending</option>
            <option value="all">All</option>
            <option value="reviewed_real_detector_miss_positive">Accepted miss</option>
            <option value="reviewed_detector_hit_or_not_miss">Not a miss</option>
            <option value="reviewed_not_ball_or_out_of_play">Out of play</option>
            <option value="review_deferred_unclear">Unclear</option>
            <option value="bad_frame_or_unusable">Bad frame</option>
          </select>
          <span class="status" id="position"></span>
        </div>
        <div class="canvas-wrap">
          <div class="image-pane"><canvas id="review-canvas" width="398" height="224"></canvas></div>
          <div class="image-pane"><img id="crop-image" alt="" /></div>
        </div>
        <div class="footer">
          <button id="reset-box">Reset box</button>
          <button id="run-resolution">Run resolver</button>
          <span class="status" id="status"></span>
        </div>
      </section>
      <aside>
        <h1>SoccerNet Detector Miss Review</h1>
        <p class="hint">If the in-play ball is visible and this is a real detector miss, draw a tight box and accept it. If the visible ball is a replacement/out-of-play ball, reject it with that reason.</p>
        <div class="progress">
          <div class="stat"><strong id="pending-count">0</strong><span>pending</span></div>
          <div class="stat"><strong id="resolved-count">0</strong><span>resolved</span></div>
          <div class="stat"><strong id="positive-count">0</strong><span>accepted misses</span></div>
          <div class="stat"><strong id="unclear-count">0</strong><span>unclear</span></div>
        </div>
        <h2>Decision</h2>
        <div class="decisions">
          <button class="primary decision-button" data-status="reviewed_real_detector_miss_positive">A Accept real miss</button>
          <button class="decision-button" data-status="reviewed_detector_hit_or_not_miss" data-default-reason="detector_hit_or_not_a_miss">N Not a detector miss</button>
          <button class="danger decision-button" data-status="reviewed_not_ball_or_out_of_play" data-default-reason="replacement_or_out_of_play_ball">O Out of play / replacement</button>
          <button class="warning decision-button" data-status="review_deferred_unclear" data-default-reason="ball_not_visible_enough_to_box_confidently">U Unclear</button>
          <button class="danger decision-button" data-status="bad_frame_or_unusable" data-default-reason="bad_frame_or_unusable">X Bad frame</button>
          <button class="decision-button" data-status="pending_review">S Save notes only</button>
        </div>
        <h2>Reason / Notes</h2>
        <div class="reason-grid">
          <button class="reason-chip" data-reason="detector_hit_or_not_a_miss">detector hit or not a miss</button>
          <button class="reason-chip" data-reason="replacement_or_out_of_play_ball">replacement / out-of-play ball</button>
          <button class="reason-chip" data-reason="not_ball_visible">no ball visible</button>
          <button class="reason-chip" data-reason="ball_not_visible_enough_to_box_confidently">unclear: cannot box confidently</button>
          <button class="reason-chip" data-reason="bad_frame_or_unusable">bad frame / unusable</button>
        </div>
        <input id="rejection-reason" placeholder="Reason for non-miss" />
        <textarea id="review-notes" placeholder="Optional review notes"></textarea>
        <label class="status"><input id="auto-advance" type="checkbox" checked /> auto-advance after save</label>
        <h2>Frame</h2>
        <dl class="meta-grid" id="meta"></dl>
      </aside>
    </main>
    <script>
      const canvas = document.getElementById("review-canvas");
      const ctx = canvas.getContext("2d");
      const cropImage = document.getElementById("crop-image");
      const statusEl = document.getElementById("status");
      const positionEl = document.getElementById("position");
      const filterEl = document.getElementById("filter");
      const reasonEl = document.getElementById("rejection-reason");
      const notesEl = document.getElementById("review-notes");
      const autoAdvanceEl = document.getElementById("auto-advance");
      const metaEl = document.getElementById("meta");
      let state = null, filteredItems = [], currentIndex = 0, image = new Image(), activeBox = null, dragStart = null, pendingAction = false;
      const setStatus = (text) => { statusEl.textContent = text || ""; };
      function setPendingAction(pending) {
        pendingAction = pending;
        document.querySelector("main").setAttribute("aria-busy", pending ? "true" : "false");
        document.querySelectorAll("main button, main input, main select, main textarea").forEach((control) => { control.disabled = pending; });
      }
      const cloneBox = (box) => box ? { x1: box.x1, y1: box.y1, x2: box.x2, y2: box.y2 } : null;
      const boxWidth = (box) => Math.max(0, box.x2 - box.x1);
      const boxHeight = (box) => Math.max(0, box.y2 - box.y1);
      const currentItem = () => filteredItems[currentIndex] || null;
      function updateStats(summary) {
        document.getElementById("pending-count").textContent = summary.pendingReviewItemCount;
        document.getElementById("resolved-count").textContent = summary.resolvedReviewItemCount;
        document.getElementById("positive-count").textContent = summary.reviewedRealDetectorMissPositiveCount;
        document.getElementById("unclear-count").textContent = summary.reviewDeferredUnclearCount;
      }
      function renderMeta(item) {
        const pairs = [["status", item.reviewStatus], ["eventLabel", item.eventLabel], ["gameTime", item.gameTime], ["frameIndex", item.frameIndex], ["team", item.team], ["visibility", item.visibility], ["reviewItemId", item.reviewItemId], ["splitGroupId", item.splitGroupId], ["sourceFrameBbox", JSON.stringify(item.sourceFrameBbox)]];
        metaEl.replaceChildren();
        pairs.forEach(([key, value]) => {
          const dt = document.createElement("dt");
          const dd = document.createElement("dd");
          dt.textContent = key;
          dd.textContent = String(value ?? "");
          metaEl.append(dt, dd);
        });
        reasonEl.value = item.rejectionReason || "";
        notesEl.value = item.reviewNotes || "";
      }
      function drawBox(box, color, label) {
        if (!box) return;
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(box.x1, box.y1, boxWidth(box), boxHeight(box));
        ctx.fillStyle = color;
        ctx.font = "14px sans-serif";
        ctx.fillText(label, box.x1, Math.max(14, box.y1 - 5));
        ctx.restore();
      }
      function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (image.complete && image.naturalWidth) ctx.drawImage(image, 0, 0);
        drawBox(activeBox, "#f2cc60", "review");
      }
      function renderMissingFrame(message) {
        canvas.width = 398;
        canvas.height = 224;
        ctx.fillStyle = "#111827";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f0f3f6";
        ctx.font = "18px sans-serif";
        ctx.fillText(message, 24, 70);
      }
      function renderCurrent() {
        const item = currentItem();
        if (!item) { positionEl.textContent = "No items"; return; }
        positionEl.textContent = `${currentIndex + 1} / ${filteredItems.length}`;
        activeBox = cloneBox(item.sourceFrameBbox);
        renderMeta(item);
        cropImage.removeAttribute("src");
        if (item.cropImageUrl) cropImage.src = item.cropImageUrl;
        image = new Image();
        if (item.fullFrameImageUrl) {
          image.onload = () => { canvas.width = image.naturalWidth; canvas.height = image.naturalHeight; redraw(); };
          image.onerror = () => renderMissingFrame("Frame failed to load");
          image.src = item.fullFrameImageUrl;
        } else {
          renderMissingFrame("No frame image");
        }
      }
      function applyFilter({ previousId = null, advance = false } = {}) {
        const filter = filterEl.value;
        filteredItems = state.reviewItems.filter((item) => filter === "all" || item.reviewStatus === filter);
        if (previousId && advance) {
          const previousIndex = filteredItems.findIndex((item) => item.reviewItemId === previousId);
          currentIndex = previousIndex >= 0 ? previousIndex + 1 : currentIndex;
        }
        currentIndex = Math.min(currentIndex, Math.max(0, filteredItems.length - 1));
        renderCurrent();
      }
      async function loadState(options = {}) {
        const response = await fetch("/api/review-state");
        if (!response.ok) throw new Error(`review-state failed: ${response.status}`);
        state = await response.json();
        updateStats(state.summary);
        applyFilter(options);
      }
      async function saveStatus(reviewStatus, defaultReason = "") {
        if (pendingAction) return;
        const item = currentItem();
        if (!item) return;
        if (defaultReason && !reasonEl.value && reviewStatus !== "reviewed_real_detector_miss_positive") reasonEl.value = defaultReason;
        const body = { reviewStatus, reviewNotes: notesEl.value };
        if (reviewStatus === "reviewed_real_detector_miss_positive") {
          body.sourceFrameBbox = activeBox;
          body.visibilityClass = "clear";
          body.contextTags = ["small_ball", "in_play"];
        } else if (reviewStatus !== "pending_review") {
          body.rejectionReason = reasonEl.value || "reviewed_not_real_detector_miss";
        }
        const previousId = item.reviewItemId;
        const advance = autoAdvanceEl.checked;
        setPendingAction(true);
        try {
          const response = await fetch(`/api/review-items/${encodeURIComponent(previousId)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          const payload = await response.json();
          if (!response.ok) { setStatus(`Save failed: ${payload.error}`); return; }
          await loadState({ previousId, advance });
          setStatus(`Saved ${reviewStatus}`);
        } catch (_) {
          setStatus("Save failed");
        } finally {
          setPendingAction(false);
        }
      }
      function pointFromEvent(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: Math.max(0, Math.min(canvas.width, (event.clientX - rect.left) * canvas.width / rect.width)), y: Math.max(0, Math.min(canvas.height, (event.clientY - rect.top) * canvas.height / rect.height)) };
      }
      canvas.addEventListener("mousedown", (event) => { if (pendingAction) return; dragStart = pointFromEvent(event); activeBox = { x1: dragStart.x, y1: dragStart.y, x2: dragStart.x, y2: dragStart.y }; redraw(); });
      canvas.addEventListener("mousemove", (event) => { if (pendingAction || !dragStart) return; const p = pointFromEvent(event); activeBox = { x1: Math.min(dragStart.x, p.x), y1: Math.min(dragStart.y, p.y), x2: Math.max(dragStart.x, p.x), y2: Math.max(dragStart.y, p.y) }; redraw(); });
      window.addEventListener("mouseup", () => { dragStart = null; if (pendingAction) return; });
      document.getElementById("previous").onclick = () => { if (pendingAction) return; currentIndex = Math.max(0, currentIndex - 1); renderCurrent(); };
      document.getElementById("next").onclick = () => { if (pendingAction) return; currentIndex = Math.min(filteredItems.length - 1, currentIndex + 1); renderCurrent(); };
      document.getElementById("reset-box").onclick = () => { if (pendingAction) return; activeBox = null; redraw(); };
      filterEl.onchange = () => { if (pendingAction) return; currentIndex = 0; applyFilter(); };
      document.querySelectorAll(".decision-button").forEach((button) => button.onclick = () => saveStatus(button.dataset.status, button.dataset.defaultReason || ""));
      document.querySelectorAll(".reason-chip").forEach((button) => button.onclick = () => { if (pendingAction) return; reasonEl.value = button.dataset.reason; setStatus(`Reason set: ${button.dataset.reason}`); });
      async function runResolution() {
        if (pendingAction) return;
        setPendingAction(true);
        try {
          setStatus("Running resolver...");
          const response = await fetch("/api/run-resolution", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
          const payload = await response.json();
          if (!response.ok) { setStatus(payload.error || "Resolver failed"); return; }
          await loadState();
          setStatus(`Resolver: ${payload.primaryBlocker || "passed"} -> ${payload.nextRecommendedNextLever}`);
        } catch (_) {
          setStatus("Resolver failed");
        } finally {
          setPendingAction(false);
        }
      }
      document.getElementById("run-resolution").onclick = () => { runResolution(); };
      loadState().catch((error) => setStatus(`Load failed: ${error}`));
    </script>
  </body>
</html>
