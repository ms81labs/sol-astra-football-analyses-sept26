name: BQ03 artifact route validation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bq03-artifact-validation.yml']

permissions:
  contents: read

env:
  VERIFY_DAYTONA: '0'
  ALLOW_DAYTONA_MUTATION: '0'
  PYTHON_DOTENV_DISABLED: '1'

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load the exact reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD~2)" = ef714ca0bf839b9d67dc0ea5664ada329b8d6c41
          mkdir -p .bq03
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          url = 'https://api.github.com/repos/ms81labs/sol-astra-football-analyses-sept26/git/blobs/717e3946a66b921b18a6b82f578b40fd60e12d2b'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=60) as response:
              packed = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha256(packed).hexdigest() == '38ecf5d70ac8bb3b11ce7e2424f2d760eed231d5a67194ed3240ef51c04cd36d'
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '0a61e9c90203c68fb2e7f2e0b027a374b63184de2b02cbfb5742e205b0af42c6'
          pathlib.Path('.bq03/reviewed.patch').write_bytes(patch)
          PY
      - name: Install media executables required by the API selection
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install locked runtime and isolated quality profiles
        run: |
          python -m pip install --require-hashes -r backend/requirements/dev.lock
          python -m pip install -e . --no-deps
          python -m venv .quality-tools
          .quality-tools/bin/python -m pip install --require-hashes -r backend/requirements/quality-linux.lock -r backend/requirements/typing-linux.lock
          python -c "import sys, fastapi, pydantic; print(sys.version); print('FastAPI', fastapi.__version__, 'Pydantic', pydantic.__version__); assert sys.version_info[:2] == (3, 11); assert fastapi.__version__ == '0.121.0'; assert pydantic.__version__ == '2.13.5'" > .bq03/profile.txt
      - name: Prove original behavior and twelve regression failures
        run: |
          git apply --include=backend/tests/test_artifact_route_dependencies.py --include=backend/tests/test_fixture_model_keywords.py --include=backend/tests/fixtures/artifact_route_openapi_paths.json .bq03/reviewed.patch
          python - <<'PY'
          import json, pathlib, runpy, subprocess, sys, xml.etree.ElementTree as ET
          ns = runpy.run_path('backend/tests/test_artifact_route_dependencies.py')
          pathlib.Path('.bq03/openapi-before.json').write_text(json.dumps(ns['_application']('first')[0].openapi(), indent=2, sort_keys=True) + '\n')
          args = [sys.executable, '-m', 'pytest', '-q', 'backend/tests/test_artifact_route_dependencies.py', 'backend/tests/test_fixture_model_keywords.py', '--junitxml=.bq03/red.xml']
          with open('.bq03/red.log', 'w') as log:
              result = subprocess.run(args, stdout=log, stderr=subprocess.STDOUT, check=False)
          cases = list(ET.parse('.bq03/red.xml').getroot().iter('testcase'))
          failures = [case for case in cases if case.find('failure') is not None]
          assert result.returncode == 1 and len(cases) == 32 and len(failures) == 12
          assert not any(case.find('error') is not None or case.find('skipped') is not None for case in cases)
          assert sum(case.attrib['name'].startswith('test_artifact_dependencies_are_resolved_annotated_metadata') for case in failures) == 8
          assert sum(case.attrib['name'].startswith('test_fixture_constructor_keywords_belong_to_the_model') for case in failures) == 4
          print('Expected RED: 12 failures, 20 passes; original pinned OpenAPI retained')
          PY
      - name: Apply the candidate and prove complete schema equivalence
        run: |
          git apply --exclude=backend/tests/test_artifact_route_dependencies.py --exclude=backend/tests/test_fixture_model_keywords.py --exclude=backend/tests/fixtures/artifact_route_openapi_paths.json .bq03/reviewed.patch
          git add backend/app/artifact_routes.py backend/quality/ruff-baseline.json backend/tests/test_artifact_route_dependencies.py backend/tests/test_fixture_model_keywords.py backend/tests/test_run_benchmark_suite.py backend/tests/test_run_benchmarks.py backend/tests/test_run_clip_manifest_expansion.py backend/tests/test_video_pipeline.py backend/tests/fixtures/artifact_route_openapi_paths.json docs/superpowers/audits/2026-09-24-backend-quality-closeout-checkpoint.md
          git rm -- .github/workflows/bq03-artifact-validation.yml
          git diff --cached --check
          test "$(git write-tree)" = 5daa12d8aafc62660ffa619bb0ab3bfcbf68ef8b
          python - <<'PY'
          import json, pathlib, runpy
          ns = runpy.run_path('backend/tests/test_artifact_route_dependencies.py')
          after = ns['_application']('first')[0].openapi()
          pathlib.Path('.bq03/openapi-after.json').write_text(json.dumps(after, indent=2, sort_keys=True) + '\n')
          assert after == json.loads(pathlib.Path('.bq03/openapi-before.json').read_text())
          print('Complete original and candidate OpenAPI are equal under locked FastAPI')
          PY
      - name: Verify route, export, fixture and publication behavior
        run: |
          set -o pipefail
          python -m pytest -q backend/tests/test_artifact_route_dependencies.py backend/tests/test_fixture_model_keywords.py backend/tests/test_api.py backend/tests/test_report_export.py backend/tests/test_export_flatteners.py backend/tests/test_run_canonical_match_bundle_export.py backend/tests/test_run_benchmark_suite.py backend/tests/test_run_benchmarks.py backend/tests/test_run_clip_manifest_expansion.py backend/tests/test_video_pipeline.py backend/tests/test_audit_v3_c03_reports.py backend/tests/test_audit_v3_c03_journey.py backend/tests/test_audit_v3_c03_publication.py backend/tests/test_audit_v3_c03_report_envelopes.py --junitxml=.bq03/focused.xml 2>&1 | tee .bq03/focused.log
          pytest -q backend/tests/test_artifact_route_dependencies.py backend/tests/test_fixture_model_keywords.py --junitxml=.bq03/console.xml 2>&1 | tee .bq03/console.log
      - name: Verify unchanged pinned quality configuration
        run: |
          export PATH="$PWD/.quality-tools/bin:$PATH"
          set -o pipefail
          ruff check backend --select F,S110,B904 | tee .bq03/ruff-clean.log
          python scripts/check_python_quality.py ruff | tee .bq03/ruff-ratchet.log
          python scripts/check_python_quality.py mypy | tee .bq03/mypy-ratchet.log
          python -m mypy --config-file pyproject.toml backend/app/artifact_routes.py | tee .bq03/route-mypy.log
      - name: Retain exact verified Git objects without publishing a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          expected = {
              'backend/app/artifact_routes.py': '1ef9383f4f176d90b8c65217ea14bd837925bdf7',
              'backend/quality/ruff-baseline.json': '3104e6f0064e4308ec449f1d490d50f314cd3cc8',
              'backend/tests/fixtures/artifact_route_openapi_paths.json': 'e7a99eb050754bc4c4c87316700f422edc54b707',
              'backend/tests/test_artifact_route_dependencies.py': '8039fed3f48d74046550c96daa423e1feb27d14e',
              'backend/tests/test_fixture_model_keywords.py': '833441c8cf9e251e8bc0459100cfac684060db02',
              'backend/tests/test_run_benchmark_suite.py': '0102c582b2d99f14fe1db2d620975043d0f3fc84',
              'backend/tests/test_run_benchmarks.py': '87148733b96e0f98c4a98d5862bc9a760d3f6e78',
              'backend/tests/test_run_clip_manifest_expansion.py': '2891b1168eb39870d13787253faede12433bfca5',
              'backend/tests/test_video_pipeline.py': '75c5b6e5ea6ff65383b76af6c92c7c1acb4ee17e',
              'docs/superpowers/audits/2026-09-24-backend-quality-closeout-checkpoint.md': '5df7ee867fd703e5a37833bd94345ada9185dec3',
          }
          assert subprocess.check_output(['git', 'write-tree']).decode().strip() == '5daa12d8aafc62660ffa619bb0ab3bfcbf68ef8b'
          def api(endpoint, data):
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/' + endpoint, data=json.dumps(data).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          entries = []
          for name, sha in expected.items():
              data = pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              assert api('git/blobs', {'content': data.decode(), 'encoding': 'utf-8'})['sha'] == sha
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          tree = api('git/trees', {'base_tree': '2f3a635ee78d1f87b47e270db536b9284d373baf', 'tree': entries})
          assert tree['sha'] == '5daa12d8aafc62660ffa619bb0ab3bfcbf68ef8b'
          receipt = {'base': 'ef714ca0bf839b9d67dc0ea5664ada329b8d6c41', 'parent': os.environ['GITHUB_SHA'], 'tree': tree['sha'], 'files': expected, 'workflowRun': os.environ['GITHUB_RUN_ID'], 'publication': 'Verified objects only; no ref moved. Authorized connector must publish and inspect normal CI.'}
          pathlib.Path('.bq03/candidate.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps({key: value for key, value in receipt.items() if key != 'files'}, indent=2))
          PY
      - name: Retain source-bound validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bq03-artifact-validation
          path: .bq03/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
