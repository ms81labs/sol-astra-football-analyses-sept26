name: C04 exact candidate publication
on:
  push:
    branches: [agent/c04-integration]
    paths: [.github/workflows/c04-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify complete candidate tree and publish only this branch
        shell: bash
        env:
          EXPECTED_MAIN: 7daf99458695b3541769e276256a640584daef71
          EXPECTED_TREE: 1fc9292779849722d74ea445d33622a80317fff8
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/c04-integration
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/agent/c04-integration | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, hashlib, json, lzma, os, shutil, subprocess
          from pathlib import Path
          root = Path('.c04-transport')
          m = json.loads((root / 'manifest.json').read_text())
          assert m['baseMain'] == os.environ['EXPECTED_MAIN']
          assert m['expectedTree'] == os.environ['EXPECTED_TREE']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^^{tree}'], text=True).strip() == m['baseTree']
          encoded = b''.join((root / f'part-{i:02d}.txt').read_bytes() for i in range(4))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == m['compressedSha256']
          dec = lzma.LZMADecompressor(memlimit=100*1024*1024)
          patch = dec.decompress(compressed, max_length=1024*1024)
          assert dec.eof and not dec.unused_data
          assert len(patch) == m['patchBytes'] == 168062
          assert hashlib.sha256(patch).hexdigest() == m['patchSha256']
          p = Path(os.environ['RUNNER_TEMP']) / 'c04.patch'
          p.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(p)], check=True)
          subprocess.run(['git', 'apply', '--index', str(p)], check=True)
          subprocess.run(['git', 'rm', '-r', '.c04-transport'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          # The token may not edit workflow files. Keep this workflow unchanged;
          # the authorized connector removes it in a separate verified commit.
          temp_index = Path(os.environ['RUNNER_TEMP']) / 'product-index'
          shutil.copyfile('.git/index', temp_index)
          env = dict(os.environ, GIT_INDEX_FILE=str(temp_index))
          subprocess.run(['git', 'update-index', '--force-remove', '.github/workflows/c04-publish.yml'], env=env, check=True)
          product = subprocess.check_output(['git', 'write-tree'], env=env, text=True).strip()
          assert product == m['expectedTree'], product
          print('Verified exact product tree:', product)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'C04 R07: exact cost ledger, conservative settlement and nullable API/UI' -m 'Exact patch and complete product tree checked. No provider/GPU execution or main merge. Full supported-profile verification remains required. The branch-only publisher is removed separately through the authorized connector.'
          test "$(git ls-remote origin refs/heads/agent/c04-integration | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/c04-integration
          echo "Published candidate $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
