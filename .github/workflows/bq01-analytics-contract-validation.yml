name: BQ01 analytics contract validation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bq01-analytics-contract-validation.yml']

permissions:
  contents: read

env:
  VERIFY_DAYTONA: '0'
  ALLOW_DAYTONA_MUTATION: '0'
  PYTHON_DOTENV_DISABLED: '1'

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact patch and original contracts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = eb39f3974986da1acf0bc8f73f85afa78d58cf70
          mkdir -p .bq01-analytics
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          url = 'https://api.github.com/repos/ms81labs/sol-astra-football-analyses-sept26/git/blobs/c573d8f0fe175ca5e44e1ae90eb3a0ea579c1935'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              packed = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha256(packed).hexdigest() == '03b60a0a660fe069cbfb20d056fdddba5a70bf0251b805069695e8c77b00c0b9'
          payload = json.loads(lzma.decompress(packed))
          patch = payload['patch'].encode()
          assert hashlib.sha256(patch).hexdigest() == '91863c477ca31e0295f87adbbde797bece3bdf1bb1c6fca9e78f3639a8b8039f'
          folder = pathlib.Path('.bq01-analytics')
          (folder / 'candidate.patch').write_bytes(patch)
          (folder / 'ast-check.py').write_text(payload['ast_check'])
          (folder / 'expected-removed.json').write_text(json.dumps(payload['removed']))
          original = pathlib.Path('backend/app/analytics.py').read_bytes()
          assert hashlib.sha256(original).hexdigest() == 'd86805b9c99d39872255a8f6573910ead234572e10cb34f3acbd761d7939b11b'
          (folder / 'analytics-before.py').write_bytes(original)
          (folder / 'pyproject-before.toml').write_bytes(pathlib.Path('pyproject.toml').read_bytes())
          (folder / 'mypy-baseline-before.json').write_bytes(pathlib.Path('backend/quality/mypy-baseline.json').read_bytes())
          subprocess.run(['git', 'apply', '--check', str(folder / 'candidate.patch')], check=True)
          subprocess.run(['git', 'apply', '--include=backend/tests/test_analytics_missing_frame.py', '--include=backend/tests/test_quality_gate.py', str(folder / 'candidate.patch')], check=True)
          PY
      - name: Install required media executables
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install unchanged locked runtime and quality profiles
        run: |
          python -m pip install --require-hashes -r backend/requirements/dev.lock
          python -m pip install -e . --no-deps
          python -m venv .quality-tools
          .quality-tools/bin/python -m pip install --require-hashes -r backend/requirements/quality-linux.lock -r backend/requirements/typing-linux.lock
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from importlib.metadata import version
          assert sys.version_info[:2] == (3, 11)
          expected = {'fastapi': '0.121.0', 'pydantic': '2.13.5', 'anyio': '4.15.1'}
          actual = {name: version(name) for name in expected}
          assert actual == expected, actual
          Path('.bq01-analytics/runtime.json').write_text(json.dumps({'python': sys.version, 'packages': actual}, indent=2) + '\n')
          PY
      - name: Prove missing-frame failures and scope failure on original source
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys, xml.etree.ElementTree as ET
          folder = pathlib.Path('.bq01-analytics')
          result = subprocess.run([sys.executable, '-m', 'pytest', '-q', 'backend/tests/test_analytics_missing_frame.py', 'backend/tests/test_quality_gate.py', '--junitxml=' + str(folder / 'before.xml')], capture_output=True, text=True)
          (folder / 'before.log').write_text(result.stdout + result.stderr)
          assert result.returncode == 1, result.stdout[-4000:]
          root = ET.parse(folder / 'before.xml').getroot()
          totals = {key: sum(int(suite.get(key, 0)) for suite in root.iter('testsuite')) for key in ('tests', 'failures', 'errors', 'skipped')}
          assert totals == {'tests': 57, 'failures': 23, 'errors': 0, 'skipped': 0}, totals
          allowed = ('test_summary_keeps_missing_event_positions_unknown', 'test_missing_frame_lookup_does_not_invent_a_position', 'test_missing_event_does_not_discard_a_located_regain', 'test_mypy_scope_keeps_clean_numeric_and_route_contracts')
          assert all(case.get('name', '').startswith(allowed) for case in root.iter('testcase') if case.find('failure') is not None)
          print(totals)
          PY
          .quality-tools/bin/python - <<'PY'
          import json, pathlib, subprocess, sys
          result = subprocess.run([sys.executable, '-m', 'mypy', '--config-file', 'pyproject.toml', '--output=json', '--no-incremental', 'backend/app/analytics.py'], capture_output=True, text=True)
          pathlib.Path('.bq01-analytics/mypy-before.jsonl').write_text(result.stdout)
          rows = [json.loads(line) for line in result.stdout.splitlines() if line.strip()]
          assert result.returncode == 1 and len(rows) == 15 and not result.stderr, (rows, result.stderr)
          PY
      - name: Apply candidate and check the sole runtime change
        run: |
          git add backend/tests/test_analytics_missing_frame.py backend/tests/test_quality_gate.py
          git apply --index --exclude=backend/tests/test_analytics_missing_frame.py --exclude=backend/tests/test_quality_gate.py .bq01-analytics/candidate.patch
          git rm -- .github/workflows/bq01-analytics-contract-validation.yml
          git diff --cached --check
          test "$(git write-tree)" = 3ce426efbe432c9c810c854cc8dbdbbff2952226
          python .bq01-analytics/ast-check.py .bq01-analytics
          python - <<'PY'
          import json, pathlib, tomllib
          folder = pathlib.Path('.bq01-analytics')
          old = tomllib.loads((folder / 'pyproject-before.toml').read_text())
          new = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          a = set(old['tool']['mypy'].pop('files'))
          b = set(new['tool']['mypy'].pop('files'))
          assert old == new and a <= b
          assert b - a == {'backend/app/insight_routes.py', 'backend/app/job_routes.py', 'backend/app/match_runtime_routes.py', 'backend/app/review_routes.py', 'backend/app/numeric_types.py'}
          old = json.loads((folder / 'mypy-baseline-before.json').read_text())
          new = json.loads(pathlib.Path('backend/quality/mypy-baseline.json').read_text())
          assert old['diagnostics'] == new['diagnostics'] == []
          assert old['metadata'].pop('configSha256') != new['metadata'].pop('configSha256')
          assert old == new
          print('Five explicitly checked modules added; no options, dependencies or diagnostic allowances changed')
          PY
      - name: Verify regression, analytics, numeric, upload and gate behavior
        run: |
          set -o pipefail
          python -m pytest -q backend/tests/test_analytics_missing_frame.py backend/tests/test_pressing_summary_contract.py backend/tests/test_analytics.py backend/tests/test_audit_analytics_fixes.py backend/tests/test_quality_numeric_contracts.py backend/tests/test_required_upload_contract.py backend/tests/test_quality_gate.py --junitxml=.bq01-analytics/after.xml 2>&1 | tee .bq01-analytics/after.log
          pytest -q backend/tests/test_analytics_missing_frame.py backend/tests/test_quality_gate.py --junitxml=.bq01-analytics/console.xml 2>&1 | tee .bq01-analytics/console.log
      - name: Verify exact quality baselines and ten retired type diagnostics
        run: |
          export PATH="$PWD/.quality-tools/bin:$PATH"
          set -o pipefail
          ruff check backend --select F,S110,B904,B008 | tee .bq01-analytics/ruff-clean.log
          python scripts/check_python_quality.py ruff | tee .bq01-analytics/ruff-ratchet.log
          python scripts/check_python_quality.py mypy | tee .bq01-analytics/mypy-ratchet.log
          python - <<'PY'
          from collections import Counter
          import json, pathlib, subprocess, sys
          folder = pathlib.Path('.bq01-analytics')
          before = [json.loads(line) for line in (folder / 'mypy-before.jsonl').read_text().splitlines() if line.strip()]
          result = subprocess.run([sys.executable, '-m', 'mypy', '--config-file', 'pyproject.toml', '--output=json', '--no-incremental', 'backend/app/analytics.py'], capture_output=True, text=True)
          (folder / 'mypy-after.jsonl').write_text(result.stdout)
          after = [json.loads(line) for line in result.stdout.splitlines() if line.strip()]
          assert result.returncode == 1 and len(after) == 5 and not result.stderr, (after, result.stderr)
          identity = lambda rows: Counter((row['file'], row['code'], row['message']) for row in rows)
          old, new = identity(before), identity(after)
          expected = Counter(tuple(row) for row in json.loads((folder / 'expected-removed.json').read_text()))
          assert not new - old and old - new == expected and sum(expected.values()) == 10
          (folder / 'typing-delta.json').write_text(json.dumps({'before': len(before), 'after': len(after), 'removed': list((old - new).elements()), 'added': []}, indent=2) + '\n')
          print('Explicit analytics: 15 to five pre-existing diagnostics; no new errors')
          PY
      - name: Retain validated Git objects without updating a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          tree_sha = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert tree_sha == '3ce426efbe432c9c810c854cc8dbdbbff2952226'
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=AM', '-z']).decode().rstrip('\0').split('\0')
          assert len(names) == 7 and all(not name.startswith('.github/') for name in names), names
          def api(endpoint, data):
              request = urllib.request.Request('https://api.github.com/repos/ms81labs/sol-astra-football-analyses-sept26/' + endpoint, data=json.dumps(data).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries, manifest = [], {}
          for name in names:
              data = pathlib.Path(name).read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert sha == subprocess.check_output(['git', 'rev-parse', ':' + name]).decode().strip(), name
              blob = api('git/blobs', {'content': data.decode(), 'encoding': 'utf-8'})
              assert blob['sha'] == sha
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
              manifest[name] = {'blob': sha, 'sha256': hashlib.sha256(data).hexdigest()}
          tree = api('git/trees', {'base_tree': 'bfc208eb7f96086e49edd463b167affeb23bac55', 'tree': entries})
          assert tree['sha'] == tree_sha
          receipt = {'base': 'eb39f3974986da1acf0bc8f73f85afa78d58cf70', 'parent': os.environ['GITHUB_SHA'], 'tree': tree_sha, 'files': manifest, 'workflowRun': os.environ['GITHUB_RUN_ID'], 'publication': 'No commit or ref written; authorized connector must publish exact validated tree and inspect normal CI.'}
          pathlib.Path('.bq01-analytics/candidate.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps({key: value for key, value in receipt.items() if key != 'files'}, indent=2))
          PY
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bq01-analytics-contract-validation
          path: .bq01-analytics/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
