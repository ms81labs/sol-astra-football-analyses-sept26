name: C02 checked dashboard patch
on:
  push:
    branches: [agent/c02-integration]
    paths: [.c02-dashboard-fix.patch.gz, .github/workflows/c02-dashboard-fix.yml]
permissions:
  contents: read
jobs:
  apply:
    if: >-
      github.event.head_commit.message == 'C02: apply verified dashboard fix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact base, patch and resulting four files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/c02-integration
          test "$(git rev-parse HEAD^)" = 476baea04acbe2cbc868f71c0f1d67574a947595
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = a453ffb476d55efa4de8ee81b03b6e322e0b2efe
          python - <<'PY'
          from pathlib import Path
          import gzip, hashlib, os, subprocess
          data = Path('.c02-dashboard-fix.patch.gz').read_bytes()
          assert hashlib.sha256(data).hexdigest() == '3346b33b3f423fd229f217c74122a7a2676576ab2cc06fc776cad889c36a9a72'
          patch = gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == 'ed055726d75cef97278fc828b77c6a6264a9aafa73709f525b94c77eb5aad45e'
          path = Path(os.environ['RUNNER_TEMP']) / 'checked-dashboard.patch'
          path.write_bytes(patch)
          expected = {
              'backend/app/main.py': '056b2c7efef3e5f91fd7317af193bcbb4f4fb3c04fd67a090e1d5abea9227477',
              'backend/app/storage.py': 'bd14dd7a4cf2a32e59f3d1d3bc7f5b75dc0a84e6410ab96788e03e1b7f68b25b',
              'backend/tests/test_audit_v3_c02_ui_contract.py': 'b1888bb414805ad637ef820c3f45ce0a1a59a49f5ca0b4de398c9fb03ffd364c',
              'backend/tests/test_dashboard.py': 'f93f81e0c46c3edd5905c2d38469dfbc2bcdc058bb2305d90298281542370c8b',
          }
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          actual = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(actual) == set(expected)
          for name, sha in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == sha, name
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'C02 R04: preserve unknown physical totals across dashboard comparisons' -m 'Fix reproduced locked-profile failures without replacing unavailable legacy totals with zero. Add real scoped-zero and mixed-eligibility controls; preserve original legacy bytes. Exact four-file patch matches local 25-pass result. Full CI remains required.'
          test "$(git ls-remote origin refs/heads/agent/c02-integration | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/c02-integration
