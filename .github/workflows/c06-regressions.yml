name: C06 media execution evidence
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - '.github/workflows/c06-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock
      - name: Install unchanged declared profile and media tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --require-hashes -r backend/requirements/dev.lock
          pip install -e . --no-deps
      - name: Retain exact source and environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .c06-evidence
          git rev-parse HEAD > .c06-evidence/source-sha.txt
          git rev-parse HEAD^{tree} > .c06-evidence/source-tree.txt
          git bundle create .c06-evidence/source.bundle HEAD
          python --version > .c06-evidence/python-version.txt
          ffmpeg -version > .c06-evidence/ffmpeg-version.txt
          ffprobe -version > .c06-evidence/ffprobe-version.txt
          sha256sum backend/requirements/dev.lock frontend/package-lock.json > .c06-evidence/lock-sha256.txt
      - name: Run actual child limits and media regressions
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          VERIFY_DAYTONA: '0'
          ALLOW_DAYTONA_MUTATION: '0'
        run: |
          set -euo pipefail
          python -m pytest -q backend/tests/test_audit_v3_c06*.py backend/tests/test_audit_v2_h06_media.py --junitxml=.c06-evidence/c06.xml 2>&1 | tee .c06-evidence/c06.log
      - name: Exercise synthetic decode beyond the old cumulative cap
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          C06_LONG_MEDIA: '1'
          C06_LONG_RECEIPT: ${{ github.workspace }}/.c06-evidence/long-execution.json
        run: |
          set -euo pipefail
          python -m pytest -q backend/tests/test_audit_v3_c06_media.py::test_optin_beyond_old_eight_gib_total --junitxml=.c06-evidence/long.xml 2>&1 | tee .c06-evidence/long.log
      - name: Hash retained evidence
        if: always()
        shell: bash
        run: |
          if [ -d .c06-evidence ]; then
            (cd .c06-evidence && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c06-media-source-evidence
          path: .c06-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
