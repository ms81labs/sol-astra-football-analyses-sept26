name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-runtime.txt
            backend/requirements-dev.txt
            backend/requirements-ml.txt
            research-addon/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -e . -r backend/requirements-dev.txt

      - name: Install sidecar
        run: pip install -e ./research-addon

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Verify artifact-independent backend
        run: >-
          python -m pytest -q backend/tests
          --ignore=backend/tests/test_convert_football_analysis_pilot_cvat_labels.py
          --ignore=backend/tests/test_evaluate_football_analysis_pilot_soccertrack_events.py
          --ignore=backend/tests/test_gpu_worker.py
          --ignore=backend/tests/test_operational_docs.py
          --ignore=backend/tests/test_run_guerilla.py
          --ignore=backend/tests/test_run_source_robustness_batch.py

      - name: Verify research sidecar
        run: python -m pytest -q research-addon/tests

      - name: Verify frontend
        run: |
          npm --prefix frontend test
          npm --prefix frontend run lint
          (cd frontend && npx tsc -p tsconfig.app.json --noEmit --incremental false)
          (cd frontend && npx tsc -p tsconfig.node.json --noEmit --incremental false)
          npm --prefix frontend run build

      - name: Verify backend import and production dependencies
        run: |
          python -c 'from backend.app.main import app'
          npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Upload verification logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: .verification/logs/
          if-no-files-found: warn
