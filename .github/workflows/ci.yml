name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-runtime.txt
            backend/requirements-dev.txt
            backend/requirements-ml.txt
            research-addon/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -e . -r backend/requirements-dev.txt

      - name: Install sidecar
        run: pip install -e ./research-addon

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Verify project
        run: scripts/verify.sh
        env:
          VERIFY_DAYTONA: '0'
          ALLOW_DAYTONA_MUTATION: '0'

      - name: Upload verification logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: .verification/logs/
          if-no-files-found: warn
