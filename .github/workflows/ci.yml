name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      gpu_approved:
        description: Run the source-bound GPU acceptance lane
        required: true
        default: false
        type: boolean
      football_evaluation_approved:
        description: Confirm independent labels and evaluation inputs are approved
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements/dev.lock
            research-addon/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend dependencies
        run: |
          pip install --require-hashes -r backend/requirements/dev.lock
          pip install -e . --no-deps
      - run: pip install -e ./research-addon
      - run: npm ci --prefix frontend
      - name: Verify code-only project
        run: scripts/verify.sh
        env:
          VERIFY_CODE_ONLY: '1'
          VERIFY_DAYTONA: '0'
          ALLOW_DAYTONA_MUTATION: '0'
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: |
            .verification/logs/
            .verification/receipt.json
            .verification/pytest-runs/
            .verification/gates.tsv
          if-no-files-found: warn


  complete-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install complete-suite CPU profile
        run: |
          pip install --require-hashes -r backend/requirements/dev.lock
          pip install -e . --no-deps
          pip install -e ./research-addon
      - name: Run complete CPU backend
        env:
          GA_VERIFICATION_RUN: '1'
          GA_VERIFICATION_PROFILE: complete-cpu
          VERIFY_DAYTONA: '0'
          ALLOW_DAYTONA_MUTATION: '0'
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          set -euo pipefail
          mkdir -p .verification/logs
          python --version > .verification/python-version.txt
          sha256sum backend/requirements/dev.lock > .verification/lock-sha256.txt
          python -m pytest -q -ra backend/tests --junitxml=.verification/backend-all.xml 2>&1 | tee .verification/logs/backend-all.log
      - name: Retain complete-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-backend-evidence
          path: .verification/
          include-hidden-files: true
          if-no-files-found: error

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements/quality-linux.lock
            backend/requirements/typing-linux.lock
      - name: Install Python quality tool
        run: pip install --require-hashes -r backend/requirements/quality-linux.lock -r backend/requirements/typing-linux.lock
      - name: Ruff correctness gate
        run: ruff check backend --select F821,F822,F823
      - run: ruff check backend/app backend/scripts --select F401
      - name: Clean production correctness and cleanup gate
        run: ruff check backend/app backend/scripts --select F,S110,B904
      - name: Script hygiene gate
        run: python backend/tests/test_script_hygiene.py
      - name: Wider Ruff diagnostic ratchet
        run: |
          set -o pipefail
          mkdir -p .verification/logs
          python scripts/check_python_quality.py ruff | tee .verification/logs/ruff-ratchet.log
      - name: Mypy Pydantic contract ratchet
        run: |
          set -o pipefail
          mkdir -p .verification/logs
          python scripts/check_python_quality.py mypy | tee .verification/logs/mypy-ratchet.log
      - name: Report Ruff legacy debt
        if: always()
        run: |
          mkdir -p .verification/logs
          ruff check backend --select RUF100,B023,ANN001,ANN002,ANN003,ANN201,ANN202,ARG002,BLE001,E402,F401,N802,N803,S310 --exit-zero --output-format=concise | grep -E 'RUF100|B023' | tee .verification/logs/ruff-debt.log
      - name: Upload Ruff debt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-debt-evidence
          path: |
            .verification/logs/ruff-debt.log
            .verification/logs/ruff-ratchet.log
            .verification/logs/mypy-ratchet.log
          if-no-files-found: error

  excluded-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install excluded-suite profile
        run: |
          pip install --require-hashes -r backend/requirements/dev.lock
          pip install -e '.[cv]' --no-deps
      - name: Run tests excluded from code-only verifier
        env:
          GA_VERIFICATION_RUN: '1'
          GA_VERIFICATION_PROFILE: excluded-cpu
        run: |
          set -o pipefail
          mkdir -p .verification/logs
          mapfile -t excluded_tests < <(grep -Ev '^[[:space:]]*(#|$)' backend/tests/code_only_exclusions.txt)
          pytest -q "${excluded_tests[@]}" \
            2>&1 | tee .verification/logs/excluded-backend.log
      - name: Upload excluded-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excluded-backend-evidence
          path: .verification/logs/
          if-no-files-found: error

  api-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/api.lock
      - name: Install and smoke-test API profile
        run: |
          pip install --dry-run --require-hashes -r backend/requirements/api.lock
          pip install --require-hashes -r backend/requirements/api.lock
          pip install -e . --no-deps
          python -c "import importlib.util; assert importlib.util.find_spec('ultralytics') is None; from backend.app.main import app"

  macos-profile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/cpu-cv-macos.lock
      - name: Dry-run macOS CPU profile
        run: pip install --dry-run --require-hashes -r backend/requirements/cpu-cv-macos.lock

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install integration profile
        run: |
          pip install --dry-run --require-hashes -r backend/requirements/dev.lock
          pip install --require-hashes -r backend/requirements/dev.lock
          pip install -e '.[cv]' --no-deps
      - name: Smoke real CPU CV imports
        run: python -c "import cv2, pandas"
      - name: Run integration tests
        env:
          GA_VERIFICATION_RUN: '1'
          GA_VERIFICATION_PROFILE: cv+dev
        run: |
          set -o pipefail
          mkdir -p .verification/logs
          pytest -m "integration or real_media" backend/tests 2>&1 | tee .verification/logs/integration.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            .verification/logs/
            .verification/receipt.json
            .verification/pytest-runs/
            .verification/gates.tsv
          if-no-files-found: warn

  real-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock
      - name: Install generated-media profile
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --require-hashes -r backend/requirements/dev.lock
          pip install -e '.[cv]' --no-deps
      - name: Run generated-media tests
        env:
          GA_VERIFICATION_RUN: '1'
          GA_VERIFICATION_PROFILE: cv+dev-real-media
        run: |
          set -o pipefail
          mkdir -p .verification/logs
          pytest -m real_media backend/tests 2>&1 | tee .verification/logs/real-media.log
      - name: Upload real-media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-media-evidence
          path: |
            .verification/logs/
            .verification/receipt.json
            .verification/pytest-runs/
            .verification/gates.tsv
          if-no-files-found: warn

  gpu-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu_approved && inputs.football_evaluation_approved
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/cuda-linux.lock
      - name: Install GPU profile
        run: |
          pip install --dry-run --require-hashes -r backend/requirements/cuda-linux.lock
          pip install --require-hashes -r backend/requirements/cuda-linux.lock
          pip install -e '.[cv,cuda]' --no-deps
      - name: Smoke real GPU CV imports
        run: python -c "import cv2, pandas, ultralytics"
      - name: Run GPU and football evaluation acceptance
        env:
          FOOTBALL_EVALUATION_APPROVED: '1'
          GA_VERIFICATION_RUN: '1'
          GA_VERIFICATION_PROFILE: cuda-linux
        run: |
          set -o pipefail
          mkdir -p .verification/logs
          pytest -q backend/tests/test_gpu_acceptance.py backend/tests/test_gpu_worker.py backend/tests/test_run_guerilla.py backend/tests/test_evaluate_football_analysis_pilot.py 2>&1 | tee .verification/logs/gpu-acceptance.log
      - name: Upload GPU acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-acceptance-evidence
          path: |
            .verification/logs/
            .verification/receipt.json
            .verification/pytest-runs/
            .verification/gates.tsv
          if-no-files-found: error
