name: C02 exact candidate publication
on:
  push:
    branches: [agent/c02-integration]
    paths: [.github/workflows/c02-publish.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact source and publish on review branch only
        shell: bash
        env:
          EXPECTED_BASE: aa65624aa034beff20d4f273ac028ffbc5348be0
          EXPECTED_MAIN: a453ffb476d55efa4de8ee81b03b6e322e0b2efe
          EXPECTED_TREE: db23bbfbe178b54bdb5448b3c787a27afab1527e
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/c02-integration
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/agent/c02-integration | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma, os, subprocess
          root = Path('.c02-transport')
          m = json.loads((root / 'manifest.json').read_text())
          assert m['base'] == os.environ['EXPECTED_BASE']
          assert m['main'] == os.environ['EXPECTED_MAIN']
          assert m['expectedProductTree'] == os.environ['EXPECTED_TREE']
          names = [f'part-{i:02d}.txt' for i in range(9)]
          assert list(m['parts']) == names
          parts = []
          for name in names:
              b = (root / name).read_bytes()
              assert len(b) <= 12000 and hashlib.sha256(b).hexdigest() == m['parts'][name]
              parts.append(b)
          compressed = base64.b64decode(b''.join(parts), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == m['xzSha256']
          dec = lzma.LZMADecompressor(memlimit=100*1024*1024)
          patch = dec.decompress(compressed, max_length=1024*1024)
          assert dec.eof and not dec.unused_data
          assert len(patch) == m['patchBytes'] == 477156
          assert hashlib.sha256(patch).hexdigest() == m['patchSha256']
          p = Path(os.environ['RUNNER_TEMP']) / 'c02.patch'
          p.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(p)], check=True)
          subprocess.run(['git', 'apply', '--index', str(p)], check=True)
          for name, digest in m['files'].items():
              f = Path(name)
              assert not f.is_symlink() and hashlib.sha256(f.read_bytes()).hexdigest() == digest, name
          assert all(not Path(name).exists() for name in m['deleted'])
          subprocess.run(['git', 'rm', '-r', '.c02-transport', '.github/workflows/c02-publish.yml'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == m['expectedProductTree'], tree
          print('Verified exact product tree:', tree)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'C02 R03 R04 N01 N04 N06: source projection, identity scope and generation-bound analyst UI' -m 'Exact locally tested candidate tree verified against source/patch hashes. Main unchanged. Full locked CI remains a gate; no provider, paid/GPU or deployment operation. Remove one-off transport and writer workflow.'
          test "$(git ls-remote origin refs/heads/agent/c02-integration | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/c02-integration
          echo "Published source $(git rev-parse HEAD), tree $(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
