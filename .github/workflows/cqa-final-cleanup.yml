name: CQA final cleanup helper

on:
  push:
    branches:
      - cursor/audit-completion-verification-417d

permissions:
  contents: write

jobs:
  apply-script-f401-cleanup:
    if: "!contains(github.event.head_commit.message, '[cqa-f401-applied]') && !contains(github.event.head_commit.message, '[cqa-helper-remove]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/audit-completion-verification-417d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/quality-linux.lock
      - name: Install pinned Ruff
        run: pip install --require-hashes -r backend/requirements/quality-linux.lock
      - name: Record RED evidence and apply safe script F401 cleanup
        run: |
          set -euo pipefail
          before="$(ruff check backend/scripts --select F401 --output-format=concise 2>&1 || true)"
          printf '%s\n' "$before"
          test -n "$before"
          ruff check backend/scripts --select F401 --fix
          ruff check backend/scripts --select F401
          git diff --check
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scripts
          if git diff --cached --quiet; then
            echo "No script F401 changes to commit"
            exit 0
          fi
          git commit -m "CQA: clean script F401 residue [cqa-f401-applied]"
          git push origin HEAD:cursor/audit-completion-verification-417d
