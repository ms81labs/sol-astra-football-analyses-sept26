name: CQA final cleanup helper

on:
  push:
    branches:
      - cursor/audit-completion-verification-417d

permissions:
  contents: read

jobs:
  inspect-app-f401:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/quality-linux.lock
      - name: Install pinned Ruff
        run: pip install --require-hashes -r backend/requirements/quality-linux.lock
      - name: Report backend app F401 residue
        run: |
          set -o pipefail
          ruff check backend/app --select F401 --output-format=concise || true
