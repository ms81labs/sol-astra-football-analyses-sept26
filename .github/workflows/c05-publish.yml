name: C05 exact reviewed checkpoint transport
on:
  push:
    branches: [agent/c05-identity-evaluation]
    paths: ['.c05-publish/**', '.github/workflows/c05-publish.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply only the checksum-bound tested product tree
        shell: bash
        run: |
          set -euo pipefail
          expected=1924996c441b5dda048692855e8c00620ded42f1
          target=refs/heads/agent/c05-identity-evaluation
          test "$GITHUB_REF" = "$target"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$expected"
          python3 - <<'PY'
          import hashlib, lzma, os
          from pathlib import Path
          raw = b''.join(Path(f'.c05-publish/part-{i}').read_bytes() for i in range(4))
          assert hashlib.sha256(raw).hexdigest() == 'a06c31ac1094376545772b86318bc84771e5c433c7252d9fb64d17fed2587104'
          patch = lzma.decompress(raw)
          assert hashlib.sha256(patch).hexdigest() == '04bbc384c17daf83c5383420f5c877c5011e0b5a4cf1a6815a9bd47ee27f9f0a'
          Path(os.environ['RUNNER_TEMP'], 'c05.patch').write_bytes(patch)
          PY
          git read-tree --reset -u "$expected"
          git apply --index "$RUNNER_TEMP/c05.patch"
          test "$(git write-tree)" = cc738e31de6a14c2de86d14d026308af513c6700
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'C05: preserve tested effective-input and evaluation implementation' -m 'Exact product tree cc738e31de6a14c2de86d14d026308af513c6700 equals local 6c29eb029190efada5d08928fe167ee4c6bf6499. Forty focused C05 cases passed locally including real pinned scorer and process checks. Full supported-profile verification remains open. No main merge, training, model/provider execution or deployment.'
          test "$(git ls-remote origin "$target" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:$target"
