name: C05 identity and evaluation evidence
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: JonathonLuiten/TrackEval
          ref: 12c8791b303e0a0b50f753af204249e622d0281a
          path: .deps/trackeval
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact scorer source without executing models
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .deps/trackeval rev-parse HEAD)" = 12c8791b303e0a0b50f753af204249e622d0281a
          mkdir -p .c05-evidence
          git -C .deps/trackeval bundle create "$GITHUB_WORKSPACE/.c05-evidence/trackeval.bundle" HEAD
          git rev-parse HEAD > .c05-evidence/source-sha.txt
          git rev-parse HEAD^{tree} > .c05-evidence/source-tree.txt
          printf '%s\n' "$GITHUB_EVENT_NAME" > .c05-evidence/event-name.txt
          printf '%s\n' "${{ github.event.pull_request.base.sha || '' }}" > .c05-evidence/event-base-sha.txt
          printf '%s\n' "${{ github.event.pull_request.head.sha || '' }}" > .c05-evidence/event-head-sha.txt
          git bundle create .c05-evidence/repository.bundle HEAD origin/main
          cd .c05-evidence
          sha256sum *.bundle > SHA256SUMS.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock
      - name: Install generated-media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install declared hash-locked profile
        run: |
          pip install --require-hashes -r backend/requirements/dev.lock
          pip install -e . --no-deps
      - name: Verify C05 with the actual pinned scorer and synthetic inputs
        shell: bash
        env:
          C05_TRACKEVAL_ROOT: ${{ github.workspace }}/.deps/trackeval
          GA_VERIFICATION_RUN: '1'
          GA_VERIFICATION_PROFILE: 'c05-pinned-cpu'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          VERIFY_DAYTONA: '0'
          ALLOW_DAYTONA_MUTATION: '0'
        run: |
          set -euo pipefail
          python --version | tee .c05-evidence/python-version.txt
          sha256sum backend/requirements/dev.lock frontend/package-lock.json > .c05-evidence/lock-sha256.txt
          python -m pytest -q backend/tests/test_audit_v3_c05*.py --junitxml=.c05-evidence/c05.xml 2>&1 | tee .c05-evidence/c05.log
      - name: Verify final composed journey
        shell: bash
        env:
          C05_TRACKEVAL_ROOT: ${{ github.workspace }}/.deps/trackeval
          GA_VERIFICATION_RUN: '1'
          GA_VERIFICATION_PROFILE: 'v3t50-pinned-cpu'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          VERIFY_DAYTONA: '0'
          ALLOW_DAYTONA_MUTATION: '0'
        run: |
          set -euo pipefail
          test "$(git -C "$C05_TRACKEVAL_ROOT" rev-parse HEAD)" = 12c8791b303e0a0b50f753af204249e622d0281a
          python -m pytest -q backend/tests/test_audit_v3_final_journey.py --junitxml=.c05-evidence/v3t50.xml 2>&1 | tee .c05-evidence/v3t50.log
      - name: Retain per-invocation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .verification/pytest-runs ]]; then
            cp -R .verification/pytest-runs .c05-evidence/pytest-runs
          fi
          (cd .c05-evidence && find . -type f ! -name evidence-sha256.txt -print0 | sort -z | xargs -0 sha256sum > evidence-sha256.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c05-source-and-scorer
          path: .c05-evidence/
          include-hidden-files: true
          if-no-files-found: error
