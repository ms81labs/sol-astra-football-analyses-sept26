name: C01 verified patch publication

on:
  push:
    branches: [agent/c01-generation-hardening-20260919]
    paths: [.github/workflows/c01-workspace.yml]

permissions:
  contents: read

concurrency:
  group: c01-reviewed-patch-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ms81labs/sol-astra-football-analyses-sept26'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact locally reviewed patch and verify every changed file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('.c01-publish')
          manifest = json.loads((root / 'manifest.json').read_text())
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert parent == manifest['base'], 'Unexpected base; refuse to overwrite intervening work'
          packed = b''.join((root / f'part-{index}.bin').read_bytes() for index in range(5))
          assert hashlib.sha256(packed).hexdigest() == manifest['gzipSha256']
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == manifest['patchSha256']
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'C01-reviewed.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed == set(manifest['files']), 'Unexpected changed paths'
          for name, expected in manifest['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Publish C01 source to its review branch only
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -- .c01-publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'C01 R01 R02 N03: implement pinned generations and pointer-authoritative recovery' -m 'Exact source verified against the locally tested patch manifest. Includes process-kill, reader/writer, retention, corruption, migration and API regressions. Draft: full-suite compatibility and locked-profile verification remain merge gates. No main merge, deployment, provider or GPU operation.'
          git push origin HEAD:refs/heads/agent/c01-generation-hardening-20260919
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  focused-verification:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHON_DOTENV_DISABLED: '1'
      VERIFY_DAYTONA: '0'
      ALLOW_DAYTONA_MUTATION: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock
      - name: Install declared locked code-only profile
        run: |
          python -m pip install --require-hashes -r backend/requirements/dev.lock
          python -m pip install -e . --no-deps
      - name: Run C01 and neighbouring regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .c01-evidence
          git rev-parse HEAD > .c01-evidence/source-sha.txt
          python --version > .c01-evidence/python-version.txt
          sha256sum backend/requirements/dev.lock > .c01-evidence/lock-sha256.txt
          python -m pytest -q backend/tests/test_audit_v3_c01_generations.py backend/tests/test_audit_v2_h02_review.py backend/tests/test_audit_v2_h03_calibration.py backend/tests/test_audit_v2_h05_recompute.py -p no:cacheprovider --junitxml=.c01-evidence/focused.xml 2>&1 | tee .c01-evidence/focused.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c01-locked-profile-evidence
          path: .c01-evidence/
          retention-days: 14
          if-no-files-found: warn
