name: BQ00 WAL repair candidate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bq00-wal-repair.yml']

permissions:
  contents: read

env:
  VERIFY_DAYTONA: '0'
  ALLOW_DAYTONA_MUTATION: '0'
  PYTHON_DOTENV_DISABLED: '1'

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize exact reviewed five-file repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = 0cad959eb1592c5719cfd3f1148068262aa177cc
          mkdir -p .bq00-wal
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          url = 'https://api.github.com/repos/ms81labs/sol-astra-football-analyses-sept26/git/blobs/15a8b4efd3290ff03c9d461448383d80be6cb738'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              packed = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha256(packed).hexdigest() == '296baae655c749dc56f4f2bb6b194473035f9b43e0e04ee66e98cbab5c133c0f'
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == 'dceb7c7c036c85dc63346382b1565b1a39a28a9182cbfe616352741e30006f3b'
          pathlib.Path('.bq00-wal/repair.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '.bq00-wal/repair.patch'], check=True)
          PY
          git rm -- .github/workflows/bq00-wal-repair.yml
          git diff --cached --check
          test "$(git write-tree)" = 2f3a635ee78d1f87b47e270db536b9284d373baf
      - name: Install locked runtime and isolated quality tools
        run: |
          python -m pip install --require-hashes -r backend/requirements/dev.lock
          python -m pip install -e . --no-deps
          python -m venv .quality-tools
          .quality-tools/bin/python -m pip install --require-hashes -r backend/requirements/quality-linux.lock -r backend/requirements/typing-linux.lock
      - name: Prove focused behavior under Python 3.11
        run: |
          set -o pipefail
          python --version | tee .bq00-wal/python-version.txt
          python -m pytest -q backend/tests/test_sqlite_connection_startup.py backend/tests/test_storage_schema_initialization.py backend/tests/test_audit_v2_h04_jobs.py backend/tests/test_quality_lifecycle_regressions.py backend/tests/test_quality_gate.py backend/tests/test_verify_script.py --junitxml=.bq00-wal/focused.xml 2>&1 | tee .bq00-wal/focused.log
      - name: Verify unchanged pinned quality baselines
        run: |
          export PATH="$PWD/.quality-tools/bin:$PATH"
          set -o pipefail
          ruff check backend --select F,S110,B904 | tee .bq00-wal/ruff-clean.log
          python scripts/check_python_quality.py ruff | tee .bq00-wal/ruff-ratchet.log
          python scripts/check_python_quality.py mypy | tee .bq00-wal/mypy-ratchet.log
          python -m mypy --config-file pyproject.toml backend/app/sqlite_connections.py | tee .bq00-wal/helper-mypy.log
      - name: Retain verified Git objects without updating a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          expected = {
              'backend/app/sqlite_connections.py': 'adb5dba2554ceb08d6844535988855b0b252f930',
              'backend/app/storage.py': 'f586f389fb45081604bdc8fe96f8aaea959d926b',
              'backend/app/workbench/jobs.py': '10ae4df21c1801d68e402c5ce14a471189575d6f',
              'backend/tests/test_sqlite_connection_startup.py': 'f9576c768a80b4e32653694c200b35e023908b30',
              'docs/superpowers/audits/2026-09-24-backend-quality-closeout-checkpoint.md': 'd48f120e1aef30b2bcd21bb03d27e160dedd6d97',
          }
          def api(endpoint, data):
              request = urllib.request.Request('https://api.github.com/repos/ms81labs/sol-astra-football-analyses-sept26/' + endpoint, data=json.dumps(data).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          assert subprocess.check_output(['git', 'write-tree']).decode().strip() == '2f3a635ee78d1f87b47e270db536b9284d373baf'
          entries = []
          for name, sha in expected.items():
              data = pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha, name
              blob = api('git/blobs', {'content': data.decode('utf-8'), 'encoding': 'utf-8'})
              assert blob['sha'] == sha, name
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          tree = api('git/trees', {'base_tree': '343cc525f24f573a94a2cd8a0abba30239d860c3', 'tree': entries})
          assert tree['sha'] == '2f3a635ee78d1f87b47e270db536b9284d373baf'
          receipt = {'base': '0cad959eb1592c5719cfd3f1148068262aa177cc', 'parent': os.environ['GITHUB_SHA'], 'tree': tree['sha'], 'files': expected, 'workflowRun': os.environ['GITHUB_RUN_ID'], 'publication': 'No ref or commit created; authorized connector must publish exact verified tree and inspect final normal CI.'}
          pathlib.Path('.bq00-wal/candidate.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps({key: value for key, value in receipt.items() if key != 'files'}, indent=2))
          PY
      - name: Retain pinned-profile repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bq00-wal-repair-candidate
          path: .bq00-wal/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
