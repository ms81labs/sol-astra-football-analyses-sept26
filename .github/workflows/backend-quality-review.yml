name: Backend quality repair verification

on:
  push:
    branches: [main]
    paths: ['.github/workflows/backend-quality-review.yml']

permissions:
  contents: read

env:
  VERIFY_DAYTONA: '0'
  ALLOW_DAYTONA_MUTATION: '0'
  PYTHON_DOTENV_DISABLED: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.candidate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: backend-quality-candidate
          run-id: 36024256888
          github-token: ${{ github.token }}
          path: .previous-review
      - name: Restore exact previously checked candidate files
        run: |
          test "$(git rev-parse HEAD^)" = fb3f2bd803823f2024050c228233abd18ee525ad
          mkdir -p .quality-review
          python - <<'PY'
          import hashlib, pathlib, subprocess, zipfile
          path = pathlib.Path('.previous-review/.quality-review/candidate-files.zip')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '1833852f9d69240d117849821db6b537722591c8e8488d6ebca97426f2e46b99'
          with zipfile.ZipFile(path) as archive:
              for name in archive.namelist():
                  target = pathlib.Path(name)
                  assert not target.is_absolute() and '..' not in target.parts
                  if name.startswith('.github/'):
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
                  subprocess.run(['git', 'add', '--', name], check=True)
          PY
          git diff --cached --check
      - name: Verify isolated locked quality profile
        run: |
          python -m venv .quality-tools
          .quality-tools/bin/python -m pip install --require-hashes -r backend/requirements/quality-linux.lock -r backend/requirements/typing-linux.lock
          export PATH="$PWD/.quality-tools/bin:$PATH"
          ruff check backend/app backend/scripts --select F,S110,B904
          python scripts/check_python_quality.py ruff
          python scripts/check_python_quality.py mypy
      - name: Create detached backend candidate without workflow changes
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.error, urllib.request, zipfile
          repository = os.environ['GITHUB_REPOSITORY']
          parent = os.environ['GITHUB_SHA']
          def api(method, endpoint, data=None):
              payload = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repository + '/' + endpoint, data=payload, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(method, endpoint, error.code, error.read().decode())
                  raise
          base = api('GET', 'git/commits/' + parent)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          entries = []
          with zipfile.ZipFile('.quality-review/candidate-files.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in filter(None, paths):
                  assert not name.startswith('.github/')
                  path = pathlib.Path(name)
                  mode = subprocess.check_output(['git', 'ls-files', '--stage', '--', name]).decode().split()[0]
                  blob = api('POST', 'git/blobs', {'content': path.read_text(), 'encoding': 'utf-8'})
                  entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
                  archive.write(path, name)
          tree = api('POST', 'git/trees', {'base_tree': base['tree']['sha'], 'tree': entries})
          commit = api('POST', 'git/commits', {'message': 'fix: preserve benchmark metrics and enforce backend quality ratchets', 'tree': tree['sha'], 'parents': [parent]})
          result = {'parent': parent, 'candidate': commit['sha'], 'tree': tree['sha'], 'changes': entries, 'workflowRun': os.environ['GITHUB_RUN_ID'], 'workflowPublication': 'CI update and temporary workflow removal require the authorized connector after candidate verification', 'diagnostics': {tool: len(json.loads(pathlib.Path('backend/quality/' + tool + '-baseline.json').read_text())['diagnostics']) for tool in ('ruff', 'mypy')}}
          pathlib.Path('.quality-review/candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('candidate=' + commit['sha'] + '\n')
          print(json.dumps(result, indent=2))
          PY
      - name: Retain candidate and measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-candidate
          path: .quality-review/
          include-hidden-files: true
          if-no-files-found: error

  complete-backend:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install complete-suite CPU profile
        run: |
          pip install --require-hashes -r backend/requirements/dev.lock
          pip install -e . --no-deps
          pip install -e ./research-addon
      - name: Run complete backend on candidate
        env:
          GA_VERIFICATION_RUN: '1'
          GA_VERIFICATION_PROFILE: complete-cpu
          EXPECTED_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          mkdir -p .verification/logs
          git rev-parse HEAD > .verification/source-commit.txt
          python -m pytest -q -ra backend/tests --junitxml=.verification/backend-all.xml 2>&1 | tee .verification/logs/backend-all.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-quality-complete-evidence
          path: .verification/
          include-hidden-files: true
          if-no-files-found: error

  canonical-verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install locked verification profile
        run: |
          pip install --require-hashes -r backend/requirements/dev.lock
          pip install -e . --no-deps
          pip install -e ./research-addon
          npm ci --prefix frontend
      - name: Run canonical code-only verifier on candidate
        env:
          VERIFY_CODE_ONLY: '1'
          EXPECTED_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-quality-verify-evidence
          path: .verification/
          include-hidden-files: true
          if-no-files-found: error
