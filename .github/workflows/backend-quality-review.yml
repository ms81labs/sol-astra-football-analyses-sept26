name: Backend quality repair verification

on:
  push:
    branches: [main]
    paths: ['.github/workflows/backend-quality-review.yml']

permissions:
  contents: read

env:
  VERIFY_DAYTONA: '0'
  ALLOW_DAYTONA_MUTATION: '0'
  PYTHON_DOTENV_DISABLED: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.candidate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact reviewed repair patch
        run: |
          test "$(git rev-parse HEAD^)" = d369240219ca487a53ef397d4062f9906a323f91
          mkdir -p .quality-review
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          payload = '''
          
          
          
          '''
          patch = lzma.decompress(base64.b64decode(''.join(payload.split())))
          assert hashlib.sha256(patch).hexdigest() == '1f5dbc531a82bdce13a3dcb78c8d4ed1917da3bef3f9486be92798bced1778f9'
          path = pathlib.Path('.quality-review/repairs.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(path)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(path)], check=True)
          PY
      - name: Resolve and hash isolated typing tools
        run: |
          python -m venv .quality-tools
          .quality-tools/bin/python -m pip download --only-binary=:all: --dest .quality-wheels mypy==2.3.1 pydantic==2.13.5
          python - <<'PY'
          import email, hashlib, pathlib, zipfile
          entries = []
          for path in pathlib.Path('.quality-wheels').glob('*.whl'):
              with zipfile.ZipFile(path) as archive:
                  names = [name for name in archive.namelist() if name.endswith('.dist-info/METADATA')]
                  assert len(names) == 1
                  metadata = email.message_from_bytes(archive.read(names[0]))
              entries.append(f"{metadata['Name']}=={metadata['Version']} --hash=sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}")
          assert any(line.startswith('mypy==2.3.1 ') for line in entries)
          assert any(line.startswith('pydantic==2.13.5 ') for line in entries)
          header = '# CPython 3.11 Linux x86-64 quality-only wheel lock; runtime locks are unchanged.\n# Resolved with: pip download --only-binary=:all: mypy==2.3.1 pydantic==2.13.5\n'
          pathlib.Path('backend/requirements/typing-linux.lock').write_text(header + '\n'.join(sorted(entries, key=str.lower)) + '\n')
          PY
          .quality-tools/bin/python -m pip install --require-hashes -r backend/requirements/quality-linux.lock -r backend/requirements/typing-linux.lock
      - name: Enforce clean fixes and capture explicit legacy baselines
        run: |
          export PATH="$PWD/.quality-tools/bin:$PATH"
          ruff check backend/app backend/scripts --select F,S110,B904
          ruff check scripts/check_python_quality.py backend/tests/test_quality_contract_regressions.py backend/tests/test_quality_lifecycle_regressions.py backend/tests/test_quality_gate.py --select F,B,BLE,S110,B904,C901
          python scripts/check_python_quality.py ruff --write-baseline
          python scripts/check_python_quality.py mypy --write-baseline
          python scripts/check_python_quality.py ruff
          python scripts/check_python_quality.py mypy
          python - <<'PY'
          import json, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(dir='.') as directory:
              path = pathlib.Path(directory) / 'pydantic_canary.py'
              path.write_text('from pydantic import BaseModel\nclass Summary(BaseModel):\n    acceptedMatchStateFrames: int = 0\nSummary(acceptedMatchStateFramez=5)\n')
              result = subprocess.run([sys.executable, '-m', 'mypy', '--config-file', 'pyproject.toml', '--output=json', str(path)], text=True, capture_output=True)
              errors = [json.loads(line) for line in result.stdout.splitlines() if line.strip()]
              assert result.returncode == 1 and not result.stderr, (result.returncode, result.stderr)
              assert any(row.get('code') == 'call-arg' and 'acceptedMatchStateFramez' in row.get('message', '') for row in errors), errors
              pathlib.Path('.quality-review/pydantic-canary.json').write_text(json.dumps(errors, indent=2) + '\n')
          PY
      - name: Create detached candidate objects without moving any branch
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/backend-quality-review.yml
          git add -u
          git add backend/quality backend/requirements/typing-linux.lock backend/tests/test_quality_contract_regressions.py backend/tests/test_quality_lifecycle_regressions.py backend/tests/test_quality_gate.py scripts/check_python_quality.py docs/superpowers/plans/2026-09-24-backend-quality-follow-up.md docs/superpowers/audits/2026-09-24-backend-quality-follow-up.md
          git diff --cached --check
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request, zipfile
          repository = os.environ['GITHUB_REPOSITORY']
          parent = os.environ['GITHUB_SHA']
          def api(method, endpoint, data=None):
              payload = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repository + '/' + endpoint, data=payload, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          base = api('GET', 'git/commits/' + parent)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          entries = []
          with zipfile.ZipFile('.quality-review/candidate-files.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in filter(None, paths):
                  path = pathlib.Path(name)
                  entry = {'path': name, 'mode': '100644', 'type': 'blob', 'sha': None}
                  if path.is_file():
                      entry['mode'] = subprocess.check_output(['git', 'ls-files', '--stage', '--', name]).decode().split()[0]
                      entry['sha'] = api('POST', 'git/blobs', {'content': path.read_text(), 'encoding': 'utf-8'})['sha']
                      archive.write(path, name)
                  entries.append(entry)
          tree = api('POST', 'git/trees', {'base_tree': base['tree']['sha'], 'tree': entries})
          commit = api('POST', 'git/commits', {'message': 'fix: preserve benchmark metrics and enforce backend quality ratchets', 'tree': tree['sha'], 'parents': [parent]})
          result = {'parent': parent, 'candidate': commit['sha'], 'tree': tree['sha'], 'changes': entries, 'workflowRun': os.environ['GITHUB_RUN_ID'], 'diagnostics': {tool: len(json.loads(pathlib.Path('backend/quality/' + tool + '-baseline.json').read_text())['diagnostics']) for tool in ('ruff', 'mypy')}}
          pathlib.Path('.quality-review/candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('candidate=' + commit['sha'] + '\n')
          print(json.dumps(result, indent=2))
          PY
      - name: Retain candidate and measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-candidate
          path: |
            .quality-review/
            backend/quality/
            backend/requirements/typing-linux.lock
          include-hidden-files: true
          if-no-files-found: error

  complete-backend:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install complete-suite CPU profile
        run: |
          pip install --require-hashes -r backend/requirements/dev.lock
          pip install -e . --no-deps
          pip install -e ./research-addon
      - name: Run complete backend on candidate
        env:
          GA_VERIFICATION_RUN: '1'
          GA_VERIFICATION_PROFILE: complete-cpu
          EXPECTED_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          test ! -e .github/workflows/backend-quality-review.yml
          mkdir -p .verification/logs
          git rev-parse HEAD > .verification/source-commit.txt
          python -m pytest -q -ra backend/tests --junitxml=.verification/backend-all.xml 2>&1 | tee .verification/logs/backend-all.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-quality-complete-evidence
          path: .verification/
          include-hidden-files: true
          if-no-files-found: error

  canonical-verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install locked verification profile
        run: |
          pip install --require-hashes -r backend/requirements/dev.lock
          pip install -e . --no-deps
          pip install -e ./research-addon
          npm ci --prefix frontend
      - name: Run canonical code-only verifier on candidate
        env:
          VERIFY_CODE_ONLY: '1'
          EXPECTED_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-quality-verify-evidence
          path: .verification/
          include-hidden-files: true
          if-no-files-found: error
