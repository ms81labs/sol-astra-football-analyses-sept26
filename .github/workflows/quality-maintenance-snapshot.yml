name: Quality maintenance candidate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/quality-maintenance-snapshot.yml']

permissions:
  contents: read

env:
  VERIFY_DAYTONA: '0'
  ALLOW_DAYTONA_MUTATION: '0'
  PYTHON_DOTENV_DISABLED: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact reviewed source without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = 8240a240b47e7ed66fd2e7816ad06babf0181362
          mkdir -p .quality-candidate
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          def api(endpoint):
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/' + endpoint, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          def blob_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def safe_path(name):
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts and not path.as_posix().startswith('.git'), name
              return path
          packed = b''.join(base64.b64decode(api('git/blobs/' + sha)['content']) for sha in ('a2ec69b909b8a9a7b9e8ab1ac8bddd22149223bb', '847cd08b33e0b1e51f2fe135393a8a6a2bd465a5'))
          assert hashlib.sha256(packed).hexdigest() == 'b58221c6c8ad63df293becc51c564da9021ba399abe3efaed83cf6648c7310f1'
          transfer = json.loads(lzma.decompress(packed))
          assert transfer['snapshot'] == '8240a240b47e7ed66fd2e7816ad06babf0181362'
          assert len(transfer['entries']) == 81
          sources = {entry['source']: safe_path(entry['source']).read_bytes() for entry in transfer['entries'] if entry['source'] is not None}
          manifest = {}
          for entry in transfer['entries']:
              path = safe_path(entry['path'])
              original = sources[entry['source']] if entry['source'] is not None else b''
              assert blob_hash(original) == entry['before'], str(path)
              lines = original.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = replacement.splitlines(keepends=True)
              data = ''.join(lines).encode('utf-8')
              assert blob_hash(data) == entry['after'], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              manifest[str(path)] = blob_hash(data)
              subprocess.run(['git', 'add', '--', str(path)], check=True)
          pathlib.Path('.quality-candidate/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          pathlib.Path('.quality-candidate/transfer.json.xz').write_bytes(packed)
          print('Verified all 81 source files against reviewed Git blob hashes')
          PY
          git diff --cached --check
      - name: Verify unchanged pinned quality configuration
        run: |
          python -m venv .quality-tools
          .quality-tools/bin/python -m pip install --require-hashes -r backend/requirements/quality-linux.lock -r backend/requirements/typing-linux.lock
          export PATH="$PWD/.quality-tools/bin:$PATH"
          set -o pipefail
          ruff check backend --select F,S110,B904 | tee .quality-candidate/ruff-clean.log
          python scripts/check_python_quality.py ruff | tee .quality-candidate/ruff-ratchet.log
          python scripts/check_python_quality.py mypy | tee .quality-candidate/mypy-ratchet.log
      - name: Create detached candidate Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.error, urllib.request, zipfile
          parent = os.environ['GITHUB_SHA']
          def api(method, endpoint, data=None):
              payload = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/' + endpoint, data=payload, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(method, endpoint, error.code, error.read().decode())
                  raise
          base = api('GET', 'git/commits/' + parent)
          manifest = json.loads(pathlib.Path('.quality-candidate/manifest.json').read_text())
          staged = set(filter(None, subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')))
          assert staged == set(manifest)
          entries = []
          with zipfile.ZipFile('.quality-candidate/changed-files.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name, expected in manifest.items():
                  assert not name.startswith('.github/')
                  path = pathlib.Path(name)
                  blob = api('POST', 'git/blobs', {'content': path.read_text(), 'encoding': 'utf-8'})
                  assert blob['sha'] == expected, name
                  mode = subprocess.check_output(['git', 'ls-files', '--stage', '--', name]).decode().split()[0]
                  entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
                  archive.write(path, name)
          tree = api('POST', 'git/trees', {'base_tree': base['tree']['sha'], 'tree': entries})
          commit = api('POST', 'git/commits', {'message': 'refactor: clean scoped types and isolate runtime evaluation and route domains', 'tree': tree['sha'], 'parents': [parent]})
          result = {'parent': parent, 'candidate': commit['sha'], 'tree': tree['sha'], 'workflowRun': os.environ['GITHUB_RUN_ID'], 'files': manifest, 'ruffLegacyDiagnostics': 504, 'mypyDiagnostics': 0, 'publication': 'Detached only: authorized connector must publish permanent CI command and remove temporary workflow before fast-forwarding main'}
          pathlib.Path('.quality-candidate/candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps({key: value for key, value in result.items() if key != 'files'}, indent=2))
          PY
      - name: Retain reviewed candidate and quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-continuation-candidate
          path: .quality-candidate/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
