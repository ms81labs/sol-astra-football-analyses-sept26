name: BQ05 pressing summary validation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bq05-pressing-validation.yml']

permissions:
  contents: read

env:
  VERIFY_DAYTONA: '0'
  ALLOW_DAYTONA_MUTATION: '0'
  PYTHON_DOTENV_DISABLED: '1'

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact candidate and immutable original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = 52a771073faf25dca888be6ac7f5b6344849fce2
          mkdir -p .bq05-pressing
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          url = 'https://api.github.com/repos/ms81labs/sol-astra-football-analyses-sept26/git/blobs/321c3a9b4428e77ccfa8a44cd3555caf0f28bf60'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              packed = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha256(packed).hexdigest() == '1ba45eb51b920de8d5c48cc44ab4e4b6ee75f5ced4a2f6b11c64ee6e709d4721'
          payload = json.loads(lzma.decompress(packed))
          patch = payload['patch'].encode()
          assert hashlib.sha256(patch).hexdigest() == '90daa11f4d305c94027c949dec9bed473f3f61008701ce83ad41aadf1e25eedd'
          folder = pathlib.Path('.bq05-pressing')
          (folder / 'candidate.patch').write_bytes(patch)
          for name in ('differential', 'mutations'):
              (folder / (name + '.py')).write_text(payload[name])
          original = pathlib.Path('backend/app/analytics.py').read_bytes()
          assert hashlib.sha256(original).hexdigest() == '46fe6c06e4fc3293bece8a2a0248a6153fd7c3a90c0fa40d11bcf32f370e1842'
          (folder / 'analytics-before.py').write_bytes(original)
          subprocess.run(['git', 'apply', '--check', str(folder / 'candidate.patch')], check=True)
          subprocess.run(['git', 'apply', '--include=backend/tests/test_pressing_summary_contract.py', str(folder / 'candidate.patch')], check=True)
          PY
      - name: Install required media executables
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install unchanged locked runtime and isolated quality tools
        run: |
          python -m pip install --require-hashes -r backend/requirements/dev.lock
          python -m pip install -e . --no-deps
          python -m venv .quality-tools
          .quality-tools/bin/python -m pip install --require-hashes -r backend/requirements/quality-linux.lock -r backend/requirements/typing-linux.lock
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from importlib.metadata import version
          assert sys.version_info[:2] == (3, 11)
          expected = {'fastapi': '0.121.0', 'pydantic': '2.13.5', 'anyio': '4.15.1'}
          actual = {name: version(name) for name in expected}
          assert actual == expected, actual
          Path('.bq05-pressing/runtime.json').write_text(json.dumps({'python': sys.version, 'packages': actual}, indent=2) + '\n')
          PY
      - name: Characterize original behavior and retain original diagnostics
        run: |
          set -o pipefail
          python -m pytest -q backend/tests/test_pressing_summary_contract.py --junitxml=.bq05-pressing/before.xml 2>&1 | tee .bq05-pressing/before.log
          .quality-tools/bin/python - <<'PY'
          import json, pathlib, subprocess, sys
          folder = pathlib.Path('.bq05-pressing')
          result = subprocess.run([sys.executable, '-m', 'mypy', '--config-file', 'pyproject.toml', '--output=json', '--no-incremental', 'backend/app/analytics.py'], capture_output=True, text=True)
          (folder / 'mypy-before.jsonl').write_text(result.stdout)
          rows = [json.loads(line) for line in result.stdout.splitlines() if line.strip()]
          assert result.returncode == 1 and len(rows) == 16 and not result.stderr, (rows, result.stderr)
          assert any(row['code'] == 'var-annotated' and 'counterpress_samples' in row['message'] for row in rows)
          result = subprocess.run(['.quality-tools/bin/ruff', 'check', 'backend/app/analytics.py', '--select', 'C901', '--output-format=json'], capture_output=True, text=True)
          (folder / 'ruff-before.json').write_text(result.stdout)
          rows = json.loads(result.stdout)
          assert result.returncode == 1 and not result.stderr
          assert len([row for row in rows if row['message'] == '`_summarize_pressing_metrics` is too complex (21 > 10)']) == 1
          PY
      - name: Apply candidate and prove differential equivalence
        run: |
          git add backend/tests/test_pressing_summary_contract.py
          git apply --index --exclude=backend/tests/test_pressing_summary_contract.py .bq05-pressing/candidate.patch
          git rm -- .github/workflows/bq05-pressing-validation.yml
          git diff --cached --check
          test "$(git write-tree)" = bfc208eb7f96086e49edd463b167affeb23bac55
          python .bq05-pressing/differential.py .bq05-pressing/analytics-before.py .bq05-pressing/differential.json
      - name: Prove behavior-changing mutations are rejected and restore exact source
        run: |
          python .bq05-pressing/mutations.py .bq05-pressing/mutations
          git diff --exit-code -- backend/app/analytics.py
      - name: Verify selected behavior and console pytest
        run: |
          set -o pipefail
          python -m pytest -q backend/tests/test_pressing_summary_contract.py backend/tests/test_analytics.py backend/tests/test_audit_analytics_fixes.py backend/tests/test_quality_numeric_contracts.py backend/tests/test_required_upload_contract.py --junitxml=.bq05-pressing/after.xml 2>&1 | tee .bq05-pressing/after.log
          pytest -q backend/tests/test_pressing_summary_contract.py --junitxml=.bq05-pressing/console.xml 2>&1 | tee .bq05-pressing/console.log
      - name: Verify exact quality baselines and explicit typing delta
        run: |
          export PATH="$PWD/.quality-tools/bin:$PATH"
          set -o pipefail
          ruff check backend --select F,S110,B904,B008 | tee .bq05-pressing/ruff-clean.log
          python scripts/check_python_quality.py ruff | tee .bq05-pressing/ruff-ratchet.log
          python scripts/check_python_quality.py mypy | tee .bq05-pressing/mypy-ratchet.log
          python - <<'PY'
          from collections import Counter
          import json, pathlib, subprocess, sys
          folder = pathlib.Path('.bq05-pressing')
          before = [json.loads(line) for line in (folder / 'mypy-before.jsonl').read_text().splitlines() if line.strip()]
          result = subprocess.run([sys.executable, '-m', 'mypy', '--config-file', 'pyproject.toml', '--output=json', '--no-incremental', 'backend/app/analytics.py'], capture_output=True, text=True)
          (folder / 'mypy-after.jsonl').write_text(result.stdout)
          after = [json.loads(line) for line in result.stdout.splitlines() if line.strip()]
          assert result.returncode == 1 and len(after) == 15 and not result.stderr, (after, result.stderr)
          identity = lambda rows: Counter((row['file'], row['code'], row['message']) for row in rows)
          old, new = identity(before), identity(after)
          assert not new - old
          assert list((old - new).elements()) == [('backend/app/analytics.py', 'var-annotated', 'Need type annotation for "counterpress_samples"')]
          (folder / 'typing-delta.json').write_text(json.dumps({'before': len(before), 'after': len(after), 'removed': list((old - new).elements()), 'added': []}, indent=2) + '\n')
          result = subprocess.run(['ruff', 'check', 'backend/app/analytics.py', '--select', 'C901', '--config', 'lint.mccabe.max-complexity=0', '--output-format=json'], capture_output=True, text=True)
          assert result.returncode == 1 and not result.stderr
          (folder / 'complexity.json').write_text(result.stdout)
          print('Explicit analytics: 16 to 15 pre-existing diagnostics; no new errors')
          PY
      - name: Retain validated Git objects without updating a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          tree_sha = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert tree_sha == 'bfc208eb7f96086e49edd463b167affeb23bac55'
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=AM', '-z']).decode().rstrip('\0').split('\0')
          assert set(names) == {'backend/app/analytics.py', 'backend/tests/test_pressing_summary_contract.py', 'backend/quality/ruff-baseline.json', 'docs/superpowers/audits/2026-09-24-backend-quality-closeout-checkpoint.md'}
          def api(endpoint, data):
              request = urllib.request.Request('https://api.github.com/repos/ms81labs/sol-astra-football-analyses-sept26/' + endpoint, data=json.dumps(data).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries, manifest = [], {}
          for name in names:
              data = pathlib.Path(name).read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert sha == subprocess.check_output(['git', 'rev-parse', ':' + name]).decode().strip(), name
              blob = api('git/blobs', {'content': data.decode(), 'encoding': 'utf-8'})
              assert blob['sha'] == sha
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
              manifest[name] = {'blob': sha, 'sha256': hashlib.sha256(data).hexdigest()}
          tree = api('git/trees', {'base_tree': 'a9e7003363f4eec892f9a90679a0e2c8ff675f19', 'tree': entries})
          assert tree['sha'] == tree_sha
          receipt = {'base': '52a771073faf25dca888be6ac7f5b6344849fce2', 'parent': os.environ['GITHUB_SHA'], 'tree': tree_sha, 'files': manifest, 'workflowRun': os.environ['GITHUB_RUN_ID'], 'publication': 'No commit or ref written; authorized connector must publish exact validated tree and inspect normal CI.'}
          pathlib.Path('.bq05-pressing/candidate.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps({key: value for key, value in receipt.items() if key != 'files'}, indent=2))
          PY
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bq05-pressing-validation
          path: .bq05-pressing/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
