name: CQA JSON helper audit

on:
  push:
    branches:
      - cursor/audit-completion-verification-417d

permissions:
  contents: read

jobs:
  red-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove local-helper gate is RED
        run: |
          set +e
          python backend/tests/test_script_hygiene.py > /tmp/hygiene.log 2>&1
          hygiene_rc=$?
          python - <<'PY' > /tmp/import.log 2>&1
          from backend.scripts.football_external_real_eval_chain_common import (
              load_json_dict_or_empty_existing,
              load_json_dict_or_empty_optional,
              load_json_dict_or_empty_required,
              load_json_object_at_strict,
              load_json_object_payload_strict,
              load_json_object_strict,
              write_json_sorted_no_newline,
              write_json_unsorted_newline,
              write_json_unsorted_no_newline,
          )
          PY
          import_rc=$?
          set -e
          cat /tmp/hygiene.log
          cat /tmp/import.log
          echo "hygiene_rc=$hygiene_rc import_rc=$import_rc"
          test "$hygiene_rc" -ne 0
          test "$import_rc" -ne 0
